name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      NUITKA_CACHE_DIR: ${{ github.workspace }}\.nuitka-cache
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: tools/requirements-build.txt
      - name: Cache Nuitka (C compile cache, downloads)
        uses: actions/cache@v4.2.3
        with:
          path: .nuitka-cache
          key: nuitka-${{ runner.os }}-${{ hashFiles('tools/requirements-build.txt') }}-${{ hashFiles('agent_bridge/**') }}
          restore-keys: |
            nuitka-${{ runner.os }}-${{ hashFiles('tools/requirements-build.txt') }}-
            nuitka-${{ runner.os }}-
      - name: Inno Setup
        shell: pwsh
        run: |
          $c = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (-not $c) {
            foreach ($d in "${env:ProgramFiles(x86)}\Inno Setup 6", "$env:ProgramFiles\Inno Setup 6", "$env:ProgramFiles\Inno Setup 7") {
              if (Test-Path "$d\ISCC.exe") { $c = "$d\ISCC.exe" }
            }
          } else { $c = $c.Source }
          if (-not $c) {
            choco install innosetup -y --no-progress
            foreach ($d in "${env:ProgramFiles(x86)}\Inno Setup 6", "$env:ProgramFiles\Inno Setup 6", "$env:ProgramFiles\Inno Setup 7") {
              if (Test-Path "$d\ISCC.exe") { $c = "$d\ISCC.exe" }
            }
          }
          if (-not $c) { throw "no ISCC.exe" }
          Write-Host "ISCC: $c"
          "ISCC=$c" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Tag matches __version__
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = ([regex]'__version__\s*=\s*"([^"]+)"').Match((Get-Content agent_bridge\__init__.py -Raw)).Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} != __version__ $v" }
      - name: Claude / Codex detection against real Windows processes (look-alike install types)
        shell: pwsh
        run: python tools\ci_detect.py
      - name: Build (Nuitka app + bus.exe, smoke test, Inno Setup installer, zip)
        shell: cmd
        run: build_desktop.cmd -Zip
      - name: Isolated "CC Msg TEST" installer (branch / PR builds only, for manual tray tests; never released)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        shell: pwsh
        run: |
          $v = ([regex]'__version__\s*=\s*"([^"]+)"').Match((Get-Content agent_bridge\__init__.py -Raw)).Groups[1].Value
          New-Item -ItemType Directory -Force dist\test | Out-Null
          & $env:ISCC /Q "/DTestBuild=1" "/DAppVersion=$v" "/DSourceDir=$PWD\dist\CCMsg" "/DOutputDir=$PWD\dist\test" installer\CCMsg.iss
          if ($LASTEXITCODE) { throw "ISCC TEST failed" }
          Get-ChildItem dist\test
      - uses: actions/upload-artifact@v4.6.2
        if: "!startsWith(github.ref, 'refs/tags/v')"
        with:
          name: CCMsg-TEST-Setup
          path: dist/test/CCMsg-TEST-Setup-*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: CCMsg-Setup
          path: |
            dist/CCMsg-Setup-*.exe
            dist/CCMsg-Setup-*.exe.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: CCMsg-windows-x64
          path: dist/CCMsg-*-windows-x64.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
      - name: install.sh in a temp copy (temp HOME)
        run: |
          set -eux
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          APP="$RUNNER_TEMP/agent-bridge"
          git archive --format=tar --prefix=agent-bridge/ HEAD | tar -x -C "$RUNNER_TEMP"
          cd "$APP"
          bash install.sh
          sh run.sh selftest
      - name: smoke test (server, home page, API, LAN gate)
        run: |
          set -eux
          export HOME="$RUNNER_TEMP/home"
          cd "$RUNNER_TEMP/agent-bridge"
          sh run.sh --no-browser --port 8799 --host 0.0.0.0 > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8799/api/ping && break; sleep 1; done
          curl -fsS http://127.0.0.1:8799/ | grep -q "<title>CC Msg</title>"
          curl -fsS http://127.0.0.1:8799/api/me | grep -q '"local": true'
          curl -fsS http://127.0.0.1:8799/api/projects
          IP=$(hostname -I | awk '{print $1}')
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://$IP:8800/api/projects")" = 401
          sh run.sh pair --port 8799 | grep -q "/pair?c="
          kill %1 || true
          cat "$RUNNER_TEMP/server.log"
      - name: package
        run: |
          set -eux
          mkdir -p dist
          git archive --format=tar.gz --prefix=agent-bridge/ -o dist/agent-bridge-linux.tar.gz HEAD
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: agent-bridge-linux
          path: dist/agent-bridge-linux.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-desktop, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          path: out
          merge-multiple: true
      - name: compat copy for 0.2.x updaters (they only look for AgentBridge-Setup-*.exe)
        run: |
          set -eux
          cd out
          for f in CCMsg-Setup-*.exe; do
            v="${f#CCMsg-Setup-}"; v="${v%.exe}"
            cp "$f" "AgentBridge-Setup-$v.exe"
            echo "$(sha256sum "AgentBridge-Setup-$v.exe" | cut -d' ' -f1)  AgentBridge-Setup-$v.exe" > "AgentBridge-Setup-$v.exe.sha256"
          done
          ls -l
      - uses: softprops/action-gh-release@v2.3.2
        with:
          files: |
            out/CCMsg-Setup-*.exe
            out/CCMsg-Setup-*.exe.sha256
            out/AgentBridge-Setup-*.exe
            out/AgentBridge-Setup-*.exe.sha256
            out/agent-bridge-linux.tar.gz
          generate_release_notes: true
