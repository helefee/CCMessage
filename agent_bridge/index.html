<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>/* 主题：先按记下的值设好，免得先白后黑闪一下；没记 / 记的是 system = 跟随系统 */
try { var t = localStorage.getItem("msgbus.theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}</script>
<title>会话消息总线</title>
<link rel="icon" href="/icon.png">
<style>
:root{
  --bg:#f4f5f7;--panel:#fff;--panel2:#fafbfc;--line:#e2e5e9;--line2:#eef0f3;--text:#1c2127;--muted:#6a737d;--faint:#9aa3ad;
  --accent:#2f6fde;--accent-weak:#e8f0ff;--ok:#1f8a4c;--ok-weak:#e3f5ea;--warn:#b7791f;--warn-weak:#fdf3e1;--bad:#c53030;--bad-weak:#fdeaea;
  --claude:#c2622e;--cursor:#3b6fd6;--codex:#1f8a7e;--user:#6b5bd2;--shadow:0 6px 24px rgba(20,30,40,.12);
  --mono:ui-monospace,SFMono-Regular,Consolas,"Cascadia Mono",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131619;--panel:#1b1f24;--panel2:#171a1e;--line:#2c3239;--line2:#23282e;--text:#e3e7eb;--muted:#9aa4ae;--faint:#6b747e;
  --accent:#6b9cff;--accent-weak:#1f2d48;--ok:#4cc38a;--ok-weak:#16302a;--warn:#e7b949;--warn-weak:#352c14;--bad:#f07a7a;--bad-weak:#3a1d1f;
  --claude:#e59566;--cursor:#7ea6ff;--codex:#4fd1c5;--user:#a99dff;--shadow:0 8px 30px rgba(0,0,0,.45);}}
:root[data-theme="dark"]{
  --bg:#131619;--panel:#1b1f24;--panel2:#171a1e;--line:#2c3239;--line2:#23282e;--text:#e3e7eb;--muted:#9aa4ae;--faint:#6b747e;
  --accent:#6b9cff;--accent-weak:#1f2d48;--ok:#4cc38a;--ok-weak:#16302a;--warn:#e7b949;--warn-weak:#352c14;--bad:#f07a7a;--bad-weak:#3a1d1f;
  --claude:#e59566;--cursor:#7ea6ff;--codex:#4fd1c5;--user:#a99dff;--shadow:0 8px 30px rgba(0,0,0,.45);}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 system-ui,"Microsoft YaHei",sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:4px 11px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.ghost:hover{color:var(--text);background:var(--line2)}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 8px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}

/* 顶栏 */
.top{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:700;white-space:nowrap}
.projsel{max-width:260px}
.pills{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.pill{font-size:12px;padding:1px 9px;border-radius:20px;border:1px solid var(--line);white-space:nowrap;cursor:default}
.pill.ok{color:var(--ok);background:var(--ok-weak);border-color:transparent}
.pill.warn{color:var(--warn);background:var(--warn-weak);border-color:transparent}
.pill.bad{color:var(--bad);background:var(--bad-weak);border-color:transparent}
.topact{display:flex;gap:6px;align-items:center}
.menu{position:relative}
.menu .list{position:absolute;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);padding:4px;min-width:160px;display:none;z-index:20}
.menu.open .list{display:block}
.menu .list button{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:6px}
.menu .list button:hover{background:var(--line2)}
.menu .list .danger{color:var(--bad)}
.banner{grid-column:1/-1;padding:6px 14px;font-size:13px;background:var(--warn-weak);color:var(--warn);border-bottom:1px solid var(--line)}

/* 主体 */
.body{display:grid;grid-template-columns:250px 1fr 280px;min-height:0}
.sideL{border-left:0!important;border-right:1px solid var(--line)}
.winpos{font-weight:400;font-size:11.5px;color:var(--faint)}
/* 刷新按钮 */
.rf{border:0;background:transparent;color:var(--muted);padding:0 5px;font-size:14px;line-height:1;cursor:pointer}
.rf:hover{color:var(--accent)}
.rf.spin{animation:spin .7s linear}
@keyframes spin{to{transform:rotate(360deg)}}
/* 网页里的信件动画 */
.fly{position:fixed;left:0;top:0;z-index:60;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:2px;will-change:transform,opacity}
.fly .env{width:44px;height:30px;border-radius:5px;background:#fffdf7;border:2px solid #b9b0a0;position:relative;box-shadow:0 4px 12px rgba(0,0,0,.25);overflow:hidden}
.fly .env::before{content:"";position:absolute;left:-2px;right:-2px;top:-2px;height:22px;background:#f3ede1;border:2px solid #b9b0a0;
  clip-path:polygon(0 0,100% 0,50% 100%)}
.fly .seal{position:absolute;left:50%;top:9px;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;z-index:1;color:#fff;font-size:8px;line-height:13px;text-align:center;font-weight:700}
.fly .lbl{font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px;color:#fff;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.srow.landed,.card.landed h3{animation:landed 1.3s ease-out}
@keyframes landed{0%{background:var(--accent-weak);box-shadow:0 0 0 2px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
@media (max-width:1150px) and (min-width:861px){.body{grid-template-columns:205px 1fr 235px}}
.center{display:grid;grid-template-rows:auto 1fr auto;min-height:0;position:relative}
.filters{display:flex;gap:6px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.chip{font-size:12.5px;padding:2px 10px;border-radius:20px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip .n{opacity:.75;margin-left:3px}
.filters input{margin-left:auto;width:190px;padding:3px 8px;font-size:13px}

.stream{overflow:auto;padding:12px 14px 18px;display:flex;flex-direction:column;gap:8px}
.day{align-self:center;font-size:12px;color:var(--faint);margin:6px 0 2px}
.msg{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px 9px;max-width:980px;position:relative}
.msg.mine{border-left:3px solid var(--user)}
.msg.task{border-left:3px solid var(--warn)}
.msg.result{border-left:3px solid var(--ok)}
.msg.result.fail{border-left-color:var(--bad)}
.msg.hl{box-shadow:0 0 0 2px var(--accent)}
.meta{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.who{font-weight:600;font-size:13px}
.a-claude{color:var(--claude)}.a-cursor{color:var(--cursor)}.a-codex{color:var(--codex)}.a-user{color:var(--user)}
.badge{font-size:11px;padding:0 7px;border-radius:9px;font-weight:600}
.b-task{color:var(--warn);background:var(--warn-weak)}
.b-ok{color:var(--ok);background:var(--ok-weak)}
.b-bad{color:var(--bad);background:var(--bad-weak)}
.b-wait{color:var(--warn);background:var(--warn-weak)}
.link{color:var(--accent);cursor:pointer;text-decoration:none}
.link:hover{text-decoration:underline}
.txt{white-space:pre-wrap;word-break:break-word;margin-top:4px}
.txt.clamp{max-height:8.2em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent)}
.more{font-size:12px;margin-top:2px}
.acts{position:absolute;right:8px;top:6px;display:none;gap:2px}
.msg:hover .acts{display:flex}
.acts button{padding:0 7px;font-size:12px}
.linked{margin-top:6px;padding:6px 10px;border-radius:7px;background:var(--panel2);border:1px dashed var(--line);font-size:13px}
.linked .txt{margin-top:2px}
.empty{color:var(--muted);text-align:center;margin:60px auto}
.newpill{position:absolute;left:50%;transform:translateX(-50%);bottom:84px;background:var(--accent);color:#fff;border:0;border-radius:20px;padding:4px 14px;box-shadow:var(--shadow);display:none;z-index:5}

/* 发送区 */
.compose{border-top:1px solid var(--line);background:var(--panel);padding:8px 14px 10px}
.crow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:3px 12px}
.seg button.on{background:var(--accent);color:#fff}
.crow select{max-width:300px}
.crow .hint{margin-left:auto;color:var(--faint);font-size:12px}
.cin{display:flex;gap:8px;align-items:flex-end}
.cin textarea{flex:1;resize:none;min-height:38px;max-height:200px}

/* 右栏 */
.side{border-left:1px solid var(--line);background:var(--panel);overflow:auto;min-height:0}
.card{padding:10px 12px;border-bottom:1px solid var(--line)}
.card h3{font-size:12.5px;color:var(--muted);margin:0 0 6px;font-weight:600;display:flex;align-items:center;gap:6px}
.card h3 .sp{margin-left:auto}
.grp{font-size:11.5px;color:var(--faint);margin:8px 0 3px}
.srow{display:flex;gap:8px;align-items:center;padding:5px 6px;border-radius:7px;cursor:pointer}
.srow:hover{background:var(--line2)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.bbw{position:relative;flex:none;width:26px;height:26px;display:inline-block}
.bbw svg{display:block;overflow:visible}
@media (prefers-reduced-motion: reduce){.bbw.live svg{animation:none}}
.bbw .dot{position:absolute;right:-2px;bottom:-1px;width:8px;height:8px;box-shadow:0 0 0 2px var(--bg)}
.bb-a{transform-box:view-box;transform-origin:0 0;animation-timing-function:linear;animation-iteration-count:infinite}
/* 活跃的头像再加一点上下浮动：26 像素下眨眼和呼吸太细，一眼看不出在动 */
.bbw.live svg{animation:bbBob 1.6s ease-in-out infinite}
@keyframes bbBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@media (prefers-reduced-motion: reduce){.bb-a{animation:none!important}}
.d-stand{background:var(--ok)}.d-active{background:var(--accent)}.d-idle{background:var(--faint)}
.srow .nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .sub{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.srow .grow{min-width:0;flex:1}
.tabs{display:flex;gap:4px}
.tabs .chip{font-size:11.5px;padding:0 8px}

/* 弹层 */
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:9px;padding:7px 14px;font-size:13px;z-index:40;display:none;max-width:90vw}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
.dlg.open{display:flex}
.dlg .box{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);width:min(620px,100%);max-height:85vh;display:flex;flex-direction:column}
.dlg .hd{padding:12px 16px;font-weight:700;border-bottom:1px solid var(--line);display:flex;align-items:center}
.dlg .hd button{margin-left:auto}
.dlg .bd{padding:12px 16px;overflow:auto}
.dlg .ft{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.dlg pre{white-space:pre-wrap;font-family:var(--mono);font-size:12.5px;margin:0}
.dlg.wide .box{width:min(1100px,100%);height:88vh;max-height:88vh}
.smtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.smtabs button.on{background:var(--accent-weak);color:var(--accent);border-color:var(--accent)}
.smbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.smbar input[type=search]{flex:1;min-width:180px}
.smrow{display:flex;gap:10px;align-items:flex-start;padding:8px 6px;border-bottom:1px solid var(--line2)}
.smrow:hover{background:var(--panel2)}
.smrow .grow{flex:1;min-width:0}
.smrow .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.smrow .m{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.smrow .acts{display:flex;gap:4px;flex-shrink:0}
.smrow .acts button{padding:2px 8px;font-size:12px}
.smtag{display:inline-block;font-size:11px;padding:0 6px;border-radius:8px;margin-left:6px;font-weight:400;vertical-align:1px}
.smtag.ok{background:var(--ok-weak);color:var(--ok)}.smtag.warn{background:var(--warn-weak);color:var(--warn)}.smtag.mut{background:var(--line2);color:var(--muted)}
.smcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.smcard h4{margin:0 0 6px;font-size:14px}
.smnote{color:var(--muted);font-size:12.5px;line-height:1.7}
.smchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.smbig{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:6px 0 8px}
.smbig span{color:var(--muted);font-size:13px}.smbig span b{font-size:24px;color:var(--text);margin-right:4px}
.smbig button.primary{margin-left:auto;padding:7px 18px}
.smchip{border:1px solid var(--line)!important;background:var(--panel)!important;border-radius:999px!important;padding:3px 12px!important;font-size:13px}
.smchip b{margin-left:4px;font-weight:600;color:var(--muted)}
.smchip.on{background:var(--accent)!important;border-color:var(--accent)!important;color:#fff}
.smchip.on b{color:#fff}
.smsep{width:1px;background:var(--line);margin:2px 4px}
.smtip{border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:13px;line-height:1.7;background:var(--warn-weak);color:var(--text)}
.smtip a{color:var(--accent);cursor:pointer;text-decoration:underline}
.smsel{position:sticky;top:-12px;z-index:2;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 10px;margin:0 -4px 6px;
  border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.smsel.has{background:var(--accent-weak);border-color:var(--accent)}
.smsel .cnt{font-weight:600;margin:0 6px 0 2px}
.smsel input[type=checkbox],.smrow input[type=checkbox]{width:17px;height:17px;cursor:pointer;accent-color:var(--accent)}
.smsel .sp{flex:1}
.smsel button{font-size:13px}
.smsel button.warnb{background:var(--warn-weak)!important;color:var(--warn)}
.smsel button.danger{background:var(--bad-weak)!important;color:var(--bad)}
.smrow{cursor:pointer}
.smrow.sel{background:var(--accent-weak)}
.smag{flex-shrink:0;font-size:11px;font-weight:600;border-radius:6px;padding:1px 6px;margin-top:2px;min-width:44px;text-align:center}
.smag.claude{background:#f3e3d9;color:#b4532a}.smag.codex{background:#dff0e6;color:#1f7a4c}
@media (prefers-color-scheme:dark){.smag.claude{background:#3b2a20;color:#f0a27a}.smag.codex{background:#173126;color:#6fd3a0}}
:root[data-theme=dark] .smag.claude{background:#3b2a20;color:#f0a27a}:root[data-theme=dark] .smag.codex{background:#173126;color:#6fd3a0}
:root[data-theme=light] .smag.claude{background:#f3e3d9;color:#b4532a}:root[data-theme=light] .smag.codex{background:#dff0e6;color:#1f7a4c}
.smrow .acts button{background:transparent!important;border:1px solid var(--line)!important}
.smrow .acts button:hover{border-color:var(--accent)!important}
@media (max-width:640px){.smrow .acts{flex-direction:column}.dlg.wide .box{height:92vh}}
.step{padding:2px 0}
.step.ok{color:var(--ok)}.step.bad{color:var(--bad)}
body.phone .admin{display:none!important}
body.nofx .needfx, body.nocdesk .needcdesk{display:none!important}
body:not(.inapp) #mBrowser{display:none!important}
body:not(.nofx) .onlynofx{display:none}
/* 只有一个模式（原来的简洁 / 完整合并了）：功能都在，次要信息做小、折叠，或放进悬停提示 */
.srow .sub{font-size:11px}
.card h3{margin-bottom:4px}
.card h3{white-space:nowrap;min-width:0}
.card h3>span:first-child{display:inline-flex;align-items:center;gap:4px;flex:none}
.card h3 .winpos{min-width:0;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;gap:3px}
.card h3 .winpos .ic{flex:none}
.trhead .note{display:inline-flex;align-items:center;color:var(--faint);cursor:help;flex:none}
.trhead .note .ic{width:15px;height:15px}
.trhead .note:hover{color:var(--accent)}
.srow.dim{opacity:.6}
.smore{margin-top:2px}
.smore>summary{list-style:none;cursor:pointer;font-size:11.5px;color:var(--faint);padding:4px 9px;border-radius:7px}
.smore>summary::-webkit-details-marker{display:none}
.smore>summary::before{content:"▸ "}
.smore[open]>summary::before{content:"▾ "}
.smore>summary:hover{background:var(--hover);color:var(--text)}
/* 别让任何一块把整页撑宽（body 是 overflow:hidden，撑宽了右边就直接跑出窗口）：
   网格的中间列用 minmax(0,1fr)，各容器 min-width:0，长内容在自己里面换行 / 省略 / 滚动 */
.app{grid-template-columns:minmax(0,1fr)}
.body{grid-template-columns:250px minmax(0,1fr) 280px}
@media (max-width:1150px) and (min-width:861px){.body{grid-template-columns:205px minmax(0,1fr) 235px}}
@media (max-width:1150px){.pfbody{padding-left:3px}}
@media (max-width:860px){.pfbody{padding-left:10px}.pfold>summary{padding:10px 8px;font-size:14.5px}.pfold>summary .ic{width:17px;height:17px}}
/* 会话标题栏最左边的返回键（桌面也显示）：回到总线消息；顶部标签页已去掉 */
.mback{border:0;background:transparent;color:var(--muted);padding:3px 6px;border-radius:8px;display:inline-flex;align-items:center;cursor:pointer;flex:none}
.mback:hover{background:var(--hover);color:var(--text)}
.mback .ic{width:18px;height:18px}
.brand{cursor:pointer}
.srow.open{background:var(--hover2);box-shadow:inset 0 0 0 1px var(--line)}
.srow.open .nm{color:var(--text)}
/* 会话列表按项目分文件夹（像 Claude Code 桌面版侧栏）：当前项目默认展开，其它项目折起；开合状态记在本地 */
.pfold{margin:1px 0;min-width:0}
.pfold>summary{list-style:none;display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:7px;cursor:pointer;font-size:12.5px;color:var(--muted);min-width:0;user-select:none}
.pfold>summary::-webkit-details-marker{display:none}
.pfold>summary:hover{background:var(--hover);color:var(--text)}
.pfold>summary .ic{width:15px;height:15px;flex:none}
.pfold>summary .fchev{width:12px;height:12px;transition:transform .15s;opacity:.7}
.pfold[open]>summary .fchev{transform:rotate(90deg)}
.pfold .pfn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.pfold.cur .pfn{color:var(--text)}
.pfold .pfcur{font-size:10.5px;line-height:16px;padding:0 5px;border-radius:5px;background:var(--accent-weak);color:var(--accent);flex:none}
.pfold .pfc{font-size:11px;color:var(--faint);flex:none;font-variant-numeric:tabular-nums}
.pfbody{padding-left:10px;min-width:0}
.pfbody>.grp{padding:4px 6px}
.top,.pills,.center,.center>div,.side,.filters,.crow,.compose,.stream,.trhead{min-width:0}
.side{overflow-x:hidden}
.stream{overflow-x:hidden}
.msg,.txt{overflow-wrap:anywhere}
.top .projsel{max-width:260px;min-width:0;text-overflow:ellipsis}
.crow select{min-width:0}
.filters #q{min-width:0;flex:1 1 140px;max-width:280px}
.pill{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trhead{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line2);font-size:13px;flex-wrap:wrap}
.trhead .nm{font-weight:700;font-size:14px}
.trv{gap:10px}
.bub{max-width:min(820px,88%);padding:8px 12px;border-radius:12px;word-break:break-word;border:1px solid var(--line)}
.bub .bx{white-space:pre-wrap}
.bub.u{align-self:flex-end;background:var(--accent-weak);border-color:transparent;border-bottom-right-radius:4px}
.bub.a{align-self:flex-start;background:var(--panel);border-bottom-left-radius:4px}
.bub .bt{font-size:11.5px;color:var(--faint);margin-top:3px}
.bub.clamp .bx{max-height:14em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 75%,transparent)}
.tools{align-self:flex-start;font-size:12px;color:var(--muted);font-family:var(--mono);max-width:88%}
.tools summary{cursor:pointer;list-style:none;padding:2px 8px;border-radius:6px;background:var(--line2);display:inline-block}
.tools summary::-webkit-details-marker{display:none}
.tools .tl{padding:1px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 子任务（Claude Code 的 Task / Agent 子代理）卡片 */
.subgrp{align-self:flex-start;width:min(780px,96%);border-left:2px solid var(--line);padding-left:8px;margin:4px 0;display:flex;flex-direction:column;gap:6px}
.subgrp>.sgh{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.subtask{align-self:flex-start;width:min(760px,96%);border:1px solid var(--line);border-radius:12px;background:var(--panel);font-size:13px;margin:2px 0}
.subgrp .subtask{width:100%}
.subtask .sth{display:flex;gap:8px;align-items:center;padding:7px 10px;cursor:pointer;flex-wrap:wrap;user-select:none}
.subtask .sth:hover{background:var(--hover);border-radius:12px}
.subtask .ds{font-weight:600;flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subtask .stm{color:var(--muted);font-size:12px;white-space:nowrap}
.subtask .stb{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--line2);color:var(--muted);font-family:var(--mono);white-space:nowrap}
.subtask .sts{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.subtask .spinr{width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
.subtask .chev{color:var(--faint);font-size:11px}
.subtask .sbd{border-top:1px solid var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.subtask .lbl{font-size:12px;color:var(--muted);cursor:pointer}
.subtask pre{white-space:pre-wrap;word-break:break-word;margin:0;font-size:12.5px;max-height:18em;overflow:auto;background:var(--bg);border-radius:8px;padding:6px 8px;font-family:inherit}
.subtask .sconv{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto;padding:6px;background:var(--bg);border-radius:8px}
.subtask .sconv .bub{max-width:96%}
.subtask .snow{font-size:12px;color:var(--muted);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subtask.st-failed{border-color:var(--bad)}
@media (max-width:640px){.subtask,.subgrp{width:100%}.subtask .ds{white-space:normal}}
.qr{background:#fff;border-radius:12px;padding:10px;width:240px;height:240px;margin:6px auto}
.qr svg{width:100%;height:100%}
.devrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line2);font-size:13px}
.devrow .grow{flex:1}
code{font-family:var(--mono);font-size:12px;background:var(--line2);padding:1px 5px;border-radius:4px}

.mob{display:none!important}
/* SVG 图标：跟着字号和文字颜色走 */
.ic{width:1.1em;height:1.1em;vertical-align:-.18em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.logo{width:1.05em;height:1.05em;margin-right:4px;fill:currentColor;stroke:none}
.menu .list button{display:flex;align-items:center;gap:9px}
.menu .list button .ic{color:var(--muted)}
.menu .list button .ic.ok{margin-left:auto;color:var(--ok)}
#dlgTitle{display:inline-flex;align-items:center;gap:8px}
.toast{align-items:center;gap:8px}
.toast[style*="block"]{display:flex!important}
/* 有新版本：右下角一张小卡片，不挡操作 */
#updBar{position:fixed;right:16px;bottom:44px;width:340px;max-width:calc(100vw - 32px);background:var(--panel);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;z-index:35;font-size:13px;display:none}
#updBar.show{display:block}
#updBar .uh{display:flex;align-items:center;gap:8px;font-weight:600}
#updBar .uh .x{margin-left:auto;border:0;background:transparent;cursor:pointer;color:var(--muted);padding:2px}
#updBar details{margin:6px 0 2px;color:var(--muted)}
#updBar pre,.updnotes{white-space:pre-wrap;font:12.5px/1.5 var(--sans,inherit);max-height:180px;overflow:auto;margin:6px 0 0;color:var(--text)}
#updBar .ub{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.updprog{height:6px;border-radius:3px;background:var(--line2);overflow:hidden;margin-top:8px}
.updprog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.mnav{display:none}

/* ---------- 风格：照 Open WebUI —— 纯中性灰、大圆角、淡边框；你说的话是右侧圆角气泡，AI 的回复不套框；底部圆角输入浮层 ---------- */
:root{
  --bg:#ffffff;--panel:#ffffff;--panel2:#f9f9f9;--side:#f9f9f9;--hover:#ececec;--hover2:#e3e3e3;--bubble:#f4f4f4;
  --line:#e3e3e3;--line2:#ececec;--text:#0d0d0d;--muted:#676767;--faint:#9b9b9b;
  --accent:#2563eb;--accent-weak:#eff4ff;--ink:#0d0d0d;--ink-on:#ffffff;
  --shadow:0 4px 18px rgba(0,0,0,.08);--r:12px;--r2:20px;
  font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI","Microsoft YaHei",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171717;--panel:#171717;--panel2:#212121;--side:#0f0f0f;--hover:#262626;--hover2:#333333;--bubble:#262626;
  --line:#2a2a2a;--line2:#222222;--text:#ececec;--muted:#b4b4b4;--faint:#7c7c7c;
  --accent:#7aa2ff;--accent-weak:#1c2333;--ink:#ececec;--ink-on:#0d0d0d;--shadow:0 6px 24px rgba(0,0,0,.5);}}
:root[data-theme="dark"]{
  --bg:#171717;--panel:#171717;--panel2:#212121;--side:#0f0f0f;--hover:#262626;--hover2:#333333;--bubble:#262626;
  --line:#2a2a2a;--line2:#222222;--text:#ececec;--muted:#b4b4b4;--faint:#7c7c7c;
  --accent:#7aa2ff;--accent-weak:#1c2333;--ink:#ececec;--ink-on:#0d0d0d;--shadow:0 6px 24px rgba(0,0,0,.5);}
body{font-family:inherit;-webkit-font-smoothing:antialiased}
*{scrollbar-width:thin;scrollbar-color:var(--hover2) transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--hover2);border-radius:8px}::-webkit-scrollbar-track{background:transparent}
/* 按钮 / 输入：无框浅底、大圆角；主按钮是墨色（浅色主题黑、深色主题白） */
button{border:0;background:var(--hover);border-radius:10px;padding:5px 12px;transition:background .15s}
button:hover{border-color:transparent;background:var(--hover2)}
button.primary{background:var(--ink);color:var(--ink-on);border:0}
button.primary:hover{opacity:.88;background:var(--ink)}
button.ghost{background:transparent}
button.ghost:hover{background:var(--hover);color:var(--text)}
input,select,textarea{border:1px solid var(--line);border-radius:10px;background:var(--panel)}
input:focus,select:focus,textarea:focus{border-color:var(--faint)}
/* 顶栏融进背景 */
.top{background:var(--bg);border-bottom:0;padding:10px 16px}
.brand{font-weight:600;letter-spacing:.2px}
.pill{border-radius:999px;border-color:var(--line)}
.menu .list{border-radius:14px;padding:6px;border-color:var(--line)}
.menu .list button{border-radius:9px;padding:7px 10px}
.menu .list button:hover{background:var(--hover)}
.banner{border-bottom:0;margin:0 16px 6px;border-radius:var(--r)}
/* 两侧栏：浅灰底、无分隔线，行是圆角块 */
.side{background:var(--side);border-left:0}
.sideL{border-right:0}
.card{border-bottom:0;padding:10px 10px 6px}
.card h3{font-size:12px;color:var(--faint);font-weight:500;padding:0 6px}
.srow{border-radius:var(--r);padding:8px 10px;gap:12px;align-items:center}
.srow .nm{font-size:14px}
.srow .sub{font-size:11.5px;margin-top:1px}
.bbw .dot{width:10px;height:10px;right:-1px;bottom:0}
.srow:hover{background:var(--hover)}
.srow .nm{font-weight:500}
.bbw .dot{box-shadow:0 0 0 2px var(--side)}
/* 中间：标签页是圆角药丸；总线消息是淡边大圆角卡片 */
.filters{border-bottom:0;padding:6px 16px}
.chip{border:0;background:var(--hover);border-radius:999px}
.chip.on{background:var(--ink);color:var(--ink-on)}
.trhead{border-bottom:0;padding:10px 18px}
.stream{padding:12px 18px 22px;gap:10px}
.msg{border-radius:var(--r2);border-color:var(--line2);background:var(--bg);padding:10px 16px 11px;max-width:860px;align-self:center;width:100%}
.msg.mine,.msg.task,.msg.result,.msg.result.fail{border-left-width:1px;border-left-color:var(--line2)}
.msg.mine{background:var(--bubble);border-color:transparent}
.msg.task{box-shadow:inset 3px 0 var(--warn)}
.msg.result{box-shadow:inset 3px 0 var(--ok)}
.msg.result.fail{box-shadow:inset 3px 0 var(--bad)}
.linked{border-radius:var(--r);border-style:solid;border-color:var(--line2)}
.badge{border-radius:999px}
code{background:var(--hover);border-radius:6px}
/* 会话记录：你 = 右侧圆角气泡；AI = 不套框的正文 */
/* 会话记录：照 Grok Bot —— AI 回复也是左侧灰色圆角气泡，你的话在右侧；连续几条挨得近，气泡下只留时间 */
.trv{max-width:860px;width:100%;margin:0 auto;gap:5px;padding-top:16px}
.bub{border:0;border-radius:18px;padding:9px 15px;line-height:1.6}
.bub.a{align-self:flex-start;background:var(--bubble);max-width:min(640px,82%);border-radius:18px}
.bub.u{align-self:flex-end;background:var(--hover2);max-width:min(560px,78%);border-radius:18px}
.bub .bt{font-size:11px;color:var(--faint);margin-top:2px;opacity:.85}
.bub + .bub.u, .bub.u + .bub.a, .tools + .bub{margin-top:8px}
.tools{margin:2px 0 2px 4px}
.tools summary{border-radius:999px;background:transparent;border:1px solid var(--line);padding:2px 10px}
.trv .day{margin:10px 0 6px;font-size:12px}
/* 发送区：底部一个圆角浮层，输入框和发送键在里面 */
.compose{border-top:0;background:var(--bg);padding:6px 18px 16px}
.crow{max-width:860px;margin:0 auto 6px}
.seg{border:0;border-radius:999px;background:var(--hover);padding:2px}
.seg button{border-radius:999px;background:transparent;padding:3px 12px}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* 深色下 --panel 比分段底色还暗，选中的那格看不出来：换成亮一点的 */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button.on{background:#3a3a3a;box-shadow:none}}
:root[data-theme="dark"] .seg button.on{background:#3a3a3a;box-shadow:none}
.cin{max-width:860px;margin:0 auto;background:var(--panel2);border:1px solid var(--line);border-radius:26px;padding:6px 6px 6px 16px;
  box-shadow:var(--shadow);align-items:flex-end}
.cin textarea{border:0;background:transparent;padding:8px 0;min-height:24px}
.cin textarea:focus{border:0}
.cin button{border-radius:999px;padding:8px 16px}
.newpill{background:var(--ink);color:var(--ink-on);border-radius:999px}
/* 弹窗 / 提示 */
.dlg{background:rgba(0,0,0,.45);backdrop-filter:blur(2px)}
.dlg .box{border-radius:22px;border:1px solid var(--line2)}
.dlg .hd{border-bottom:0;padding:16px 20px 6px;font-weight:600}
.dlg .bd{padding:8px 20px 12px}
.dlg .ft{border-top:0;padding:10px 20px 18px}
.devrow{border-top-color:var(--line2)}
.toast{border-radius:999px;padding:8px 18px}

/* ---------- 风格：照 Claude Code 桌面版 —— 暖灰底、橙色点缀；你的话是右侧圆角气泡，Claude 的回复是不套框的正文（Markdown），
   工具调用是一行行的小字，子任务是细边框卡片。盖在上面那层之上，主题切换（data-theme / 跟系统）照旧 ---------- */
:root{
  --bg:#faf9f5;--panel:#ffffff;--panel2:#f5f4ed;--side:#f3f1ea;--hover:#ebe8de;--hover2:#e2ded1;--bubble:#efece3;
  --line:#e3dfd3;--line2:#ece9e0;--text:#141413;--muted:#6f6d66;--faint:#a19f97;
  --accent:#c96442;--accent-weak:#f7e7df;--ink:#141413;--ink-on:#faf9f5;--claude:#c96442;
  --ok:#3f8a52;--ok-weak:#e4f1e5;--warn:#a8701c;--warn-weak:#f8eedb;--bad:#bf4b3a;--bad-weak:#f8e3df;
  --codebg:#1f1e1d;--codefg:#ebe9e1;--codemuted:#a6a39b;
  --shadow:0 4px 20px rgba(60,48,30,.09);--r:9px;--r2:14px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI","Inter","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --serif:"Tiempos Text","Copernicus",Charter,"Iowan Old Style",Georgia,Cambria,"PingFang SC","Microsoft YaHei",serif;
  --mono:"JetBrains Mono","Cascadia Code","Cascadia Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
  font-family:var(--sans);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#262624;--panel:#30302e;--panel2:#2b2a28;--side:#1f1e1d;--hover:#353431;--hover2:#3e3d3a;--bubble:#393937;
  --line:#3b3a36;--line2:#31302d;--text:#faf9f5;--muted:#a6a39b;--faint:#77756e;
  --accent:#d97757;--accent-weak:#40302a;--ink:#faf9f5;--ink-on:#1f1e1d;--claude:#d97757;
  --ok:#7dbb83;--ok-weak:#26332a;--warn:#e2b25f;--warn-weak:#3a311f;--bad:#e8826f;--bad-weak:#402823;
  --codebg:#1a1918;--shadow:0 6px 24px rgba(0,0,0,.4);}}
:root[data-theme="dark"]{
  --bg:#262624;--panel:#30302e;--panel2:#2b2a28;--side:#1f1e1d;--hover:#353431;--hover2:#3e3d3a;--bubble:#393937;
  --line:#3b3a36;--line2:#31302d;--text:#faf9f5;--muted:#a6a39b;--faint:#77756e;
  --accent:#d97757;--accent-weak:#40302a;--ink:#faf9f5;--ink-on:#1f1e1d;--claude:#d97757;
  --ok:#7dbb83;--ok-weak:#26332a;--warn:#e2b25f;--warn-weak:#3a311f;--bad:#e8826f;--bad-weak:#402823;
  --codebg:#1a1918;--shadow:0 6px 24px rgba(0,0,0,.4);}
body{font-family:var(--sans);font-size:14px}
::selection{background:color-mix(in srgb,var(--accent) 30%,transparent)}
button{border-radius:8px}
button.primary{background:var(--accent);color:#fff}
button.primary:hover{background:var(--accent);opacity:.9}
input,select,textarea{border-radius:8px}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
/* 顶栏：细分隔线，品牌字带一点橙 */
.top{border-bottom:1px solid var(--line2);padding:8px 16px;gap:12px}
.brand{font-weight:600}
.brand .ic{color:var(--accent)}
.pill{font-size:11.5px;padding:1px 9px}
/* 两侧栏：更紧凑，选中项一块浅底 */
.side{background:var(--side)}
.sideL{border-right:1px solid var(--line2)!important}
#colR{border-left:1px solid var(--line2)}
.card{padding:12px 10px 6px}
.card h3{font-size:11.5px;letter-spacing:.3px;color:var(--faint);font-weight:600;margin-bottom:4px}
.srow{padding:6px 9px;gap:10px;border-radius:8px;transition:background .12s}
.srow .nm{font-size:13.5px;font-weight:500}
.srow .sub{font-size:11px;color:var(--faint)}
.srow:hover{background:var(--hover)}
.grp{color:var(--faint);padding:0 9px}
/* 标签页：小圆角块，当前的那个是一张卡 */
.chip{font-size:12px;padding:2px 10px}
.trhead{padding:8px 18px;gap:10px;border-bottom:1px solid var(--line2)}
.trhead .nm{font-weight:600;font-size:14px}
/* 总线消息流：同一条居中阅读栏 */
.stream{padding:14px max(16px,calc((100% - 760px) / 2)) 22px}
.msg{max-width:760px;border-radius:12px;border-color:var(--line2)}
.msg.mine{background:var(--bubble)}
/* ---------- 会话记录 ---------- */
.trv{max-width:none;margin:0;width:auto;padding:22px max(20px,calc((100% - 760px) / 2)) 32px;gap:6px;align-items:stretch}
.trv .day{align-self:center;font-size:11.5px;color:var(--faint);margin:14px 0 6px;letter-spacing:.3px}
.bub{line-height:1.65;font-size:15px}
.bub.u{align-self:flex-end;background:var(--bubble);color:var(--text);max-width:min(600px,85%);border-radius:16px;padding:9px 15px;margin-top:14px;font-family:var(--sans)}
.bub.a{align-self:stretch;background:transparent;max-width:100%;padding:2px 2px;border-radius:0;margin-top:6px;font-family:var(--serif);font-size:15.5px;line-height:1.7}
.bub .bt{font:11px var(--sans);color:var(--faint);opacity:0;transition:opacity .15s;margin-top:2px}
.bub:hover .bt{opacity:1}
.bub.u .bt{text-align:right}
.bub.clamp .bx{max-height:14em}
.bub.a.clamp .bx{max-height:32em}
.bub .more{font:12.5px var(--sans)}
.bub + .bub.u, .bub.u + .bub.a, .tools + .bub{margin-top:14px}
/* Markdown 正文 */
.md{white-space:normal;word-break:break-word}
.md p{margin:0 0 .8em}
.md>:last-child,.md li>:last-child,.md blockquote>:last-child{margin-bottom:0}
.md h2,.md h3,.md h4,.md h5,.md h6{font-family:var(--serif);font-weight:600;line-height:1.35;margin:1.1em 0 .45em}
.md h2{font-size:1.32em}.md h3{font-size:1.16em}.md h4{font-size:1.05em}.md h5,.md h6{font-size:1em}
.md>:first-child{margin-top:0}
.md ul,.md ol{margin:0 0 .8em;padding-left:1.45em}
.md li{margin:.25em 0}
.md li>p{margin:0 0 .3em}
.md li::marker{color:var(--muted)}
.md strong{font-weight:650}
.md a{color:var(--accent);text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px}
.md code{font-family:var(--mono);font-size:.84em;background:var(--hover);color:var(--text);padding:.12em .38em;border-radius:5px}
.md blockquote{margin:0 0 .8em;padding:1px 0 1px 14px;border-left:3px solid var(--line);color:var(--muted)}
.md hr{border:0;border-top:1px solid var(--line);margin:1.2em 0}
.md .cb{margin:.4em 0 1em;border-radius:10px;overflow:hidden;background:var(--codebg);border:1px solid var(--line);font-family:var(--sans)}
.md .cbh{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 4px 12px;font-size:12px;color:var(--codemuted);background:rgba(255,255,255,.04);min-height:28px}
.md .cpy{background:transparent;color:var(--codemuted);padding:2px 9px;font-size:12px;border-radius:6px}
.md .cpy:hover{background:rgba(255,255,255,.09);color:#faf9f5}
.md pre{margin:0;padding:10px 14px 12px;overflow:auto;max-height:520px;font:12.8px/1.6 var(--mono);color:var(--codefg);white-space:pre}
.md pre code{background:none;padding:0;font-size:inherit;color:inherit;border-radius:0}
.md .tbw{overflow-x:auto;margin:.4em 0 1em}
.md table{border-collapse:collapse;font:13.5px/1.5 var(--sans);min-width:50%}
.md th,.md td{border-bottom:1px solid var(--line);padding:6px 12px;text-align:left;vertical-align:top}
.md th{font-weight:600;color:var(--muted);border-bottom-color:var(--hover2)}
.md tr:last-child td{border-bottom:0}
/* 工具调用：一行一个，小图标 + 等宽工具名 + 参数摘要；一组可以折起来 */
.tools{align-self:stretch;max-width:100%;margin:2px 0;font:12.5px/1.5 var(--sans);color:var(--muted)}
.tools>summary{display:flex;align-items:center;gap:6px;border:0;background:transparent;padding:3px 8px 3px 4px;border-radius:8px;cursor:pointer;
  list-style:none;width:fit-content;max-width:100%;color:var(--muted)}
.tools>summary::-webkit-details-marker{display:none}
.tools>summary{white-space:nowrap}
.tools>summary>:not(.tgl){flex:none}
.tools>summary:hover{background:var(--hover);color:var(--text)}
.tools .tgc{display:inline-flex;transition:transform .15s;color:var(--faint)}
.tools[open]>summary .tgc{transform:rotate(90deg)}
.tools .tgl{font-family:var(--mono);font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:420px}
.tools .tgl::before{content:"·";margin-right:6px}
.tlist{margin:2px 0 4px 11px;padding-left:8px;border-left:1px solid var(--line)}
.tcall{font-size:12.5px}
.tcall .tsm{display:flex;align-items:center;gap:7px;padding:3px 8px;border-radius:7px;cursor:pointer;list-style:none;min-width:0;background:transparent;border:0;width:auto}
.tcall.flat .tsm{cursor:default}
.tcall>summary::-webkit-details-marker{display:none}
.tcall>summary:hover{background:var(--hover)}
.tcall .tic{color:var(--faint);display:inline-flex;flex:none}
.tcall .tn{font-family:var(--mono);font-size:12px;color:var(--text);flex:none;font-weight:500}
.tcall .ta{font-family:var(--mono);font-size:11.8px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.terr{color:var(--bad);font-size:11px;flex:none;background:var(--bad-weak);border-radius:999px;padding:0 7px;font-family:var(--sans)}
.tcall .tio{margin:2px 0 6px 27px}
.tcall .tlb{font-size:11px;color:var(--faint);margin:4px 0 2px}
.tcall pre{margin:0;padding:8px 11px;background:var(--codebg);color:var(--codefg);border-radius:8px;font:11.8px/1.55 var(--mono);max-height:260px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.tcall pre.err{color:#f2a493}
/* 子任务卡片 */
.subgrp{width:100%;align-self:stretch;border-left:0;padding-left:0;gap:6px;margin:6px 0}
.subgrp>.sgh{font-size:12px;color:var(--muted);padding-left:2px}
.subtask{width:100%;align-self:stretch;background:var(--panel2);border:1px solid var(--line);border-radius:11px;font:13.5px/1.5 var(--sans);margin:4px 0;overflow:hidden}
.subtask .sth{padding:8px 12px;gap:10px;flex-wrap:nowrap}
.subtask .sth:hover{background:var(--hover);border-radius:0}
.subtask .stb{background:var(--accent-weak);color:var(--accent);font:500 11px/18px var(--sans);padding:0 8px;flex:none}
.subtask .ds{font-weight:500;color:var(--text)}
.subtask .stm{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.subtask .chev{font-size:10px}
.subtask .sts .ic{width:15px;height:15px}
.subtask .sts .ic.ok{color:var(--ok)}
.subtask .spinr{border-color:var(--line);border-top-color:var(--accent)}
.subtask .sbd{background:var(--panel2);border-top:1px solid var(--line);padding:10px 12px}
.subtask .lbl{font-size:11.5px;color:var(--faint);letter-spacing:.2px}
.subtask details>summary.lbl{list-style:none}
.subtask details>summary.lbl::-webkit-details-marker{display:none}
.subtask details>summary.lbl::before{content:"▸ ";color:var(--faint)}
.subtask details[open]>summary.lbl::before{content:"▾ "}
.subtask pre{background:var(--bg);border:1px solid var(--line2);font:13px/1.6 var(--sans);padding:8px 10px}
.subtask .sconv{background:var(--bg);border:1px solid var(--line2);border-radius:9px;padding:8px 10px}
.subtask .sconv .bub.a{font-size:14.5px}
.subtask .sres{background:var(--bg);border:1px solid var(--line2);border-radius:9px;padding:10px 14px;max-height:26em;overflow:auto;font:14.5px/1.65 var(--serif)}
.subtask.st-failed{border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
/* 输入区：Claude 那样的大圆角输入框，发送键是橙色 */
.compose{background:var(--bg);padding:6px max(16px,calc((100% - 760px) / 2)) 16px}
.crow{max-width:760px;margin:0 auto 6px}
.seg{background:var(--hover)}
.cin{max-width:760px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:8px 8px 8px 16px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(60,48,30,.06)}
.cin:focus-within{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.cin textarea{font-size:15px;line-height:1.55;padding:6px 0}
.cin button.primary,#sendBtn{background:var(--accent);color:#fff;border-radius:10px;padding:7px 15px;font-weight:500}
.newpill{background:var(--accent);color:#fff}
.dlg .box{border-radius:16px}
.toast{border-radius:10px}
code{font-family:var(--mono)}

/* ---------- 子任务面板：标题栏按钮 + 右侧滑出（手机上整屏） ---------- */
.spbtn{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;font:500 12.5px/1.4 var(--sans);background:transparent;border:1px solid var(--line);color:var(--text);border-radius:8px;cursor:pointer}
.spbtn:hover,.spbtn.on{background:var(--hover);border-color:var(--hover2)}
.spbtn.on{color:var(--accent)}
.spbtn .ic{width:15px;height:15px}
.spbtn .spn{background:var(--hover2);color:var(--text);border-radius:999px;padding:0 6px;font-size:11px;line-height:17px;min-width:18px;text-align:center}
.spbtn .spr{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-size:11.5px}
.spbtn .spr:empty{display:none}
.spinr{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex:none}
.spbtn .spinr{width:10px;height:10px}
.spanel{position:fixed;top:0;right:0;bottom:0;width:min(460px,92vw);z-index:28;display:flex;flex-direction:column;background:var(--bg);
  border-left:1px solid var(--line);box-shadow:-10px 0 34px rgba(0,0,0,.22);transform:translateX(104%);transition:transform .22s ease;visibility:hidden}
.spanel.open{transform:none;visibility:visible}
.sph{display:flex;align-items:center;gap:8px;padding:12px 12px 10px 14px;border-bottom:1px solid var(--line2);flex:none}
.sph .spht{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px}
.sph #spTitle{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sph #spSub{font-size:12px;color:var(--muted);white-space:nowrap}
.spback,.spx{border:0;background:transparent;color:var(--muted);width:30px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;font-size:15px;cursor:pointer;flex:none}
.spback:hover,.spx:hover{background:var(--hover);color:var(--text)}
.spbody{flex:1;overflow:auto;padding:10px 12px 24px;overscroll-behavior:contain}
.spgrp{margin:4px 0 10px}
.spgh{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--faint);padding:2px 4px 4px}
.spgh .ic{width:13px;height:13px}
.spgrp .sprow{margin-left:6px;border-left:2px solid var(--line2);border-radius:0 10px 10px 0}
.sprow{display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;margin:2px 0;transition:background .12s}
.sprow:hover{background:var(--hover)}
.sprow.sel{background:var(--hover2)}
.sprow .sts,.spdh .sts{flex:none;display:inline-flex;align-items:center;height:20px}
.sprow .sts .ic,.spdh .sts .ic{width:15px;height:15px}
.sprow .ic.ok,.spdh .ic.ok{color:var(--ok)}
.sprow.st-failed .sts,.spdh .st-failed{color:var(--bad)}
.spm{flex:1;min-width:0}
.sp1{display:flex;align-items:center;gap:6px;min-width:0}
.spanel .stb{background:var(--accent-weak);color:var(--accent);font:500 11px/18px var(--sans);padding:0 8px;border-radius:999px;flex:none;white-space:nowrap}
.spbg{font-size:11px;line-height:18px;padding:0 7px;border-radius:999px;background:var(--hover2);color:var(--muted);flex:none}
.spd{font-size:13.5px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sp2{font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.splt{font:11.5px var(--mono);color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spgo{color:var(--faint);flex:none;display:inline-flex;align-self:center}
.spgo .ic{width:14px;height:14px}
.spdh{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.spdh .spdm{font-variant-numeric:tabular-nums}
.spdh .link{margin-left:auto;color:var(--accent);cursor:pointer;font-size:12.5px;white-space:nowrap}
.spdd{font-size:15px;font-weight:600;margin:8px 0 4px;line-height:1.45}
.spanel .lbl{font-size:11.5px;color:var(--faint);margin:14px 0 6px;letter-spacing:.2px}
.spanel details.spsec>summary.lbl{cursor:pointer;list-style:none}
.spanel details.spsec>summary.lbl::-webkit-details-marker{display:none}
.spanel details.spsec>summary.lbl::before{content:"▸ "}
.spanel details.spsec[open]>summary.lbl::before{content:"▾ "}
.sppr{margin:0;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:9px 11px;font:13px/1.6 var(--sans);white-space:pre-wrap;word-break:break-word;max-height:320px;overflow:auto}
.spconv{display:flex;flex-direction:column;gap:5px;border:1px solid var(--line2);border-radius:10px;padding:8px 10px;background:var(--panel2)}
.spconv .bub.a{font-size:14.5px;margin-top:4px}
.spconv .bub.u{max-width:92%}
.spconv .tools .tgl{max-width:200px}
.spres{border:1px solid var(--line2);border-radius:10px;padding:10px 14px;font:14.5px/1.65 var(--serif);background:var(--panel2)}
.spanel .empty{padding:14px 6px;color:var(--muted);font-size:13px;text-align:center}
.subtask.flash{animation:spflash 2.6s ease}
@keyframes spflash{0%,35%{box-shadow:0 0 0 2px var(--accent);background:var(--accent-weak)}100%{box-shadow:0 0 0 0 transparent}}
/* ---------- 手机：一屏一个视图 + 底部导航 ---------- */
@media (max-width:860px){
  body{font-size:15px;overflow:hidden}
  .mob{display:inline-flex!important}
  .app{height:100vh;height:100dvh;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);width:100vw}
  .center,.stream,.trv,.compose,.side{min-width:0}
  .msg,.bub{overflow-wrap:anywhere}
  .meta{min-width:0}
  .top{position:relative;flex-wrap:nowrap;padding:8px 10px;gap:8px}
  .brand .btx{display:none}
  .brand{font-size:20px}
  .projsel{flex:1;min-width:0;max-width:none;font-size:15px;padding:7px 8px}
  .pills{display:none}
  .top.showpills .pills{display:flex;position:absolute;top:calc(100% + 4px);left:8px;right:8px;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:var(--shadow);z-index:15;gap:8px}
  .top.showpills .pill{font-size:13px;padding:3px 10px}
  .stdot{width:32px;height:32px;border-radius:50%;align-items:center;justify-content:center;padding:0;flex:none}
  .stdot::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--sd,var(--ok))}
  #instBtn{display:none!important}
  #menuBtn{font-size:20px;padding:2px 10px}
  .menu .list{min-width:210px}
  .menu .list button{padding:11px 12px}

  .body{grid-template-columns:minmax(0,1fr);min-height:0}
  .side{border:0;display:none;min-height:0}
  body.m-sess .side{display:block}
  body.m-sess .center{display:none}
  .sideL{display:none!important}
  .card{border:0;padding:12px 14px}
  .card h3{font-size:14px}
  .srow{padding:11px 8px}
  .srow .nm{font-size:15.5px}
  .srow .sub{font-size:12.5px}

  .banner{font-size:12.5px;padding:6px 10px}
  .filters{flex-wrap:nowrap;overflow-x:auto;padding:8px 10px;gap:6px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .filters input{display:none}
  .filters.qopen{flex-wrap:wrap}
  .filters.qopen input{display:block;width:100%;margin:6px 0 0;flex-basis:100%;font-size:16px;padding:7px 10px}
  .chip{padding:5px 13px;font-size:13.5px;white-space:nowrap}
  .stream{padding:10px 10px 16px;gap:10px}
  .msg{padding:10px 12px;border-radius:12px}
  .who{font-size:14px}
  .acts{display:flex;position:static;margin-top:8px;justify-content:flex-end;gap:6px}
  .acts button{padding:4px 12px;font-size:13px;border-color:var(--line)}
  .bub{max-width:92%;font-size:15px}
  .tools{max-width:100%}
  .trhead{padding:8px 10px;flex-wrap:nowrap}
  .trhead .note{display:none}
  .trhead .nm{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mback{font-size:26px;line-height:1;padding:0 12px 2px 4px;border:0;background:transparent}
  .newpill{bottom:130px}

  .compose{padding:8px 10px}
  .crow{flex-wrap:nowrap;overflow-x:auto;margin-bottom:6px;gap:6px;scrollbar-width:none}
  .crow::-webkit-scrollbar{display:none}
  #wakeWrap,.crow .hint{display:none!important}
  #toWrap>span:first-child{display:none}
  .crow select{max-width:none;font-size:14px;padding:5px 8px;flex:1;min-width:0;width:100%}
  .crow .seg{flex:none}
  #toWrap{flex:1;min-width:0;display:flex}
  #toFixed{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seg button{padding:5px 14px}
  .cin textarea{font-size:16px;padding:8px 10px;min-height:42px}
  .cin button{padding:9px 16px}

  .mnav{display:flex;justify-content:space-around;border-top:1px solid var(--line);background:var(--panel);
    padding:4px 0 calc(4px + env(safe-area-inset-bottom))}
  .mnav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;font-size:19px;
    padding:4px 0;color:var(--muted);position:relative;border-radius:0}
  .mnav button span{font-size:11.5px;margin-top:1px}
  .mnav button.on{color:var(--accent)}
  .mnav i{position:absolute;top:1px;left:calc(50% + 8px);font-style:normal;font-size:10.5px;line-height:16px;min-width:16px;
    background:var(--bad);color:#fff;border-radius:9px;padding:0 5px;display:none}
  .dlg{padding:10px}
  .dlg .box{width:100%;max-height:92dvh}
  .toast{top:10px;max-width:92vw}
}
/* 手机上的 Claude 风格补丁（放最后，盖过上面的手机布局） */
@media (max-width:860px){
  .trv{padding:12px 12px 20px}
  .stream{padding:10px 10px 16px}
  .bub.u{max-width:88%}
  .bub.a{max-width:100%;font-size:15.5px}
  .compose{padding:8px 10px}
  .cin{border-radius:16px;padding:6px 6px 6px 12px}
  .cin textarea{font-size:16px}
  .tools .tgl{max-width:46vw}
  .tcall .tio{margin-left:6px}
  .subtask .sth{flex-wrap:wrap;row-gap:2px}
  .subtask .ds{flex:1 1 0;min-width:0;white-space:normal}
  .subtask .chev{order:3}
  .subtask .stm{order:4;margin-left:25px;width:100%}
  .md pre{max-height:360px;font-size:12.3px}
  .mnav button.on{color:var(--accent)}
  /* 会话标题栏一行放不下时让名字缩，别把整页撑宽（撑宽后手机会整体缩放、右边被截） */
  .trhead{gap:6px;min-width:0;max-width:100vw}
  .trhead>code{display:none}
  .trhead .nm{flex:1 1 auto;min-width:0}
  .trhead .spbtn,.trhead .rf,.trhead .mback{flex:none}
  /* 子任务面板在手机上：整屏，从下往上 */
  .spbtn{padding:3px 7px}
  .spbtn .spl{display:none}
  .spanel{width:100%;left:0;border-left:0;box-shadow:none;transform:translateY(100%)}
  .spanel.open{transform:none}
  .sph{padding:10px 8px 8px 10px}
  .spbody{padding:8px 10px 28px}
  .spdh .link{margin-left:0}
}

/* ---------- 主题：表单控件 / 滚动条跟着深浅走 ---------- */
:root{color-scheme:light dark}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
.thbtn{border:0;background:transparent;color:var(--muted);padding:4px 6px;display:inline-flex;align-items:center}
.thbtn:hover{background:var(--hover);color:var(--text)}
.thbtn .ic{width:17px;height:17px}
.menu .list .throw{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:13px;color:var(--muted)}
.menu .list .throw .ic{width:15px;height:15px}
.menu .list .throw .seg{margin-left:auto}
.menu .list .throw .seg button{display:inline-flex;width:auto;padding:3px 10px;font-size:12.5px;border-radius:999px}


/* ---------- Codex 风格：Codex 那一栏、打开的 Codex 会话（.cx 里换一套黑白灰的变量） ---------- */
.cx{
  --bg:#ffffff;--panel:#ffffff;--panel2:#f7f7f7;--side:#f9f9f9;--hover:#f0f0f0;--hover2:#e7e7e7;--bubble:#f1f1f1;
  --line:#e3e3e3;--line2:#ededed;--text:#0d0d0d;--muted:#5d5d5d;--faint:#8e8e8e;
  --accent:#0d0d0d;--accent-weak:#ececec;--ink:#0d0d0d;--ink-on:#ffffff;--codex:#0d0d0d;
  --codebg:#f6f6f6;--codefg:#1d1d1d;--codemuted:#6b6b6b;--cxadd:#1a7f37;--cxdel:#cf222e;--cxaddbg:#e6f4ea;--cxdelbg:#fdecec;
  --serif:var(--sans);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cx{
  --bg:#181818;--panel:#202020;--panel2:#1d1d1d;--side:#131313;--hover:#262626;--hover2:#2f2f2f;--bubble:#2a2a2a;
  --line:#2e2e2e;--line2:#242424;--text:#ececec;--muted:#a1a1a1;--faint:#6e6e6e;
  --accent:#ececec;--accent-weak:#2c2c2c;--ink:#ececec;--ink-on:#181818;--codex:#ececec;
  --codebg:#111111;--codefg:#e3e3e3;--codemuted:#8a8a8a;--cxadd:#5cc37a;--cxdel:#f2777a;--cxaddbg:#16301f;--cxdelbg:#3a1b1d;}}
:root[data-theme="dark"] .cx{
  --bg:#181818;--panel:#202020;--panel2:#1d1d1d;--side:#131313;--hover:#262626;--hover2:#2f2f2f;--bubble:#2a2a2a;
  --line:#2e2e2e;--line2:#242424;--text:#ececec;--muted:#a1a1a1;--faint:#6e6e6e;
  --accent:#ececec;--accent-weak:#2c2c2c;--ink:#ececec;--ink-on:#181818;--codex:#ececec;
  --codebg:#111111;--codefg:#e3e3e3;--codemuted:#8a8a8a;--cxadd:#5cc37a;--cxdel:#f2777a;--cxaddbg:#16301f;--cxdelbg:#3a1b1d;}
.side.cx{background:var(--side)}
.center.cx{background:var(--bg);color:var(--text)}
.cx .card h3{color:var(--faint)}
.cx button.primary,.cx #sendBtn,.cx .cin button.primary{background:var(--accent);color:var(--ink-on)}
.cx .md pre code{background:none;border:0;padding:0}
.cxav .ic.logo{color:var(--text);margin:0;width:58%;height:58%}
.cx .seg button.on{color:var(--ink-on)}
.cx .seg button.on{background:var(--accent)}
.cx .srow{border-radius:7px}
.cx .srow .nm{font-weight:500;color:var(--text)}
.cx .srow .sub{font-size:11px}
.cx .srow.open{background:var(--hover2);box-shadow:none}
.cx .pfold .pfcur{background:var(--hover2);color:var(--text)}
.cxav{position:relative;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:9px;background:var(--hover);color:var(--text);border:1px solid var(--line)}
.cxav .ic{width:58%;height:58%}
.cxav .dot{position:absolute;right:-2px;bottom:-2px;width:9px;height:9px;border:2px solid var(--side)}
.trhead .cxav .dot{border-color:var(--bg)}
.cx .trhead{border-bottom-color:var(--line2)}
.cx .trhead code{background:var(--hover);color:var(--muted)}
.cx .compose textarea,.cx .compose .cin{background:var(--panel)}
/* Codex 会话正文：助手的话不带气泡、无衬线；用户的话浅灰圆角块 */
.cx .trv{gap:4px}
.cx .bub.a{font:14.5px/1.7 var(--sans);color:var(--text)}
.cx .bub.u{background:var(--bubble);border-radius:14px;font-size:14px}
.cx .md h2,.cx .md h3,.cx .md h4,.cx .md h5,.cx .md h6{font-family:var(--sans);font-weight:600}
.cx .md code{background:var(--hover);border:1px solid var(--line2)}
.cx .md .cb{background:var(--codebg);border-color:var(--line)}
.cx .md .cbh{background:transparent;border-bottom:1px solid var(--line2)}
.cx .md .cpy:hover{background:var(--hover);color:var(--text)}
.cx .md pre{color:var(--codefg)}
/* Codex 的动作行：「运行 命令」「编辑 文件 +N −M」，点开看输出 / diff */
.cxg{align-self:stretch;margin:4px 0}
.cxg>summary,.cxt>summary{list-style:none;display:flex;align-items:center;gap:7px;min-width:0;cursor:pointer;padding:4px 6px;border-radius:8px;font:13px/1.5 var(--sans);color:var(--muted)}
.cxg>summary::-webkit-details-marker,.cxt>summary::-webkit-details-marker{display:none}
.cxg>summary:hover,.cxt>summary:hover{background:var(--hover);color:var(--text)}
.cxg>summary>*,.cxt>summary>*{flex:none}
.cxch{width:13px;height:13px;color:var(--faint);transition:transform .15s}
.cxg[open]>summary>.cxch,.cxt[open]>summary>.cxch{transform:rotate(90deg)}
.cxg>.cxgl{padding-left:14px;border-left:1px solid var(--line);margin:2px 0 6px 12px}
.cxgs{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto!important}
.cxt{align-self:stretch;min-width:0}
.cxv{color:var(--text);font-weight:500}
.cxc{font:12.5px var(--mono);color:var(--text);background:var(--hover);border:1px solid var(--line2);border-radius:6px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto!important;max-width:100%}
.cxf{font:12.5px var(--mono);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto!important}
.cxa{color:var(--cxadd);font:12px var(--mono)}
.cxd{color:var(--cxdel);font:12px var(--mono)}
.cxx{color:var(--cxdel);font-size:11.5px;background:var(--cxdelbg);border-radius:999px;padding:0 7px}
.cxw{color:var(--faint);font-size:11.5px;font-variant-numeric:tabular-nums}
.cxb{margin:2px 0 8px 20px;min-width:0}
.cxb pre{margin:0;padding:9px 12px;background:var(--codebg);color:var(--codefg);border:1px solid var(--line);border-radius:10px;font:12px/1.55 var(--mono);max-height:320px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.cxb pre.err{color:var(--cxdel)}
.cxb pre+pre{margin-top:6px}
.cxterm{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--codebg)}
.cxterm .cxcmd{font:12px/1.5 var(--mono);color:var(--text);padding:7px 12px;border-bottom:1px solid var(--line2);white-space:pre-wrap;word-break:break-word;max-height:140px;overflow:auto}
.cxterm pre{border:0;border-radius:0;color:var(--codemuted)}
.cxterm pre.err{color:var(--cxdel)}
.cxpend{padding:7px 12px;font-size:12px;color:var(--faint)}
.cxdiff pre{white-space:pre;padding:6px 0}
.cxdiff .dl{display:block;padding:0 12px;min-height:1.55em}
.cxdiff .da{background:var(--cxaddbg);color:var(--cxadd)}
.cxdiff .dd{background:var(--cxdelbg);color:var(--cxdel)}
.cxdiff .dh{color:var(--faint)}
.cxdiff .df{color:var(--text);font-weight:600}
.cxfl{font:12px/1.7 var(--mono);color:var(--text);margin:0 0 6px}
.cxplan{list-style:none;margin:2px 0;padding:0;font-size:13px}
.cxplan li{display:flex;gap:8px;align-items:center;padding:2px 0;color:var(--text)}
.cxplan li.completed{color:var(--faint);text-decoration:line-through}
.cxplan .ic{width:14px;height:14px;color:var(--cxadd);flex:none}
.cxplan .cxo{width:10px;height:10px;border:1.5px solid var(--faint);border-radius:50%;flex:none;margin:0 2px}
@media (max-width:860px){
  .thbtn{display:none}
  #toClaude .tcl{display:none}
  #toClaude{flex:none;padding:3px 8px}
  .cxb{margin-left:8px}
  .cxc{font-size:12px}
}
/* ---------- 字体 ----------
   字母数字：随工具带的 Inter（界面）和 JetBrains Mono（代码），都是 OFL 授权，放在 agent_bridge/fonts/，由本服务提供，
   不装进系统；只裁了拉丁字符（unicode-range），中文、中文标点照样落到微软雅黑 UI。字体文件加载不到时退回 Segoe UI / Consolas。
   以前 Claude 风格的正文用衬线（这台电脑上落到 Georgia：小写式数字、字母偏窄），现在全换无衬线。 */
@font-face{font-family:"AB Inter";src:url(/fonts/inter-regular.woff2) format("woff2");font-weight:100 449;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02C6,U+02DA,U+02DC,U+2000-2013,U+2015-2017,U+201E-2025,U+2027-206F,U+2074,U+20AC,U+2122,U+2190-2199,U+2212,U+2215}
@font-face{font-family:"AB Inter";src:url(/fonts/inter-medium.woff2) format("woff2");font-weight:450 549;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02C6,U+02DA,U+02DC,U+2000-2013,U+2015-2017,U+201E-2025,U+2027-206F,U+2074,U+20AC,U+2122,U+2190-2199,U+2212,U+2215}
@font-face{font-family:"AB Inter";src:url(/fonts/inter-semibold.woff2) format("woff2");font-weight:550 649;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02C6,U+02DA,U+02DC,U+2000-2013,U+2015-2017,U+201E-2025,U+2027-206F,U+2074,U+20AC,U+2122,U+2190-2199,U+2212,U+2215}
@font-face{font-family:"AB Inter";src:url(/fonts/inter-bold.woff2) format("woff2");font-weight:650 900;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02C6,U+02DA,U+02DC,U+2000-2013,U+2015-2017,U+201E-2025,U+2027-206F,U+2074,U+20AC,U+2122,U+2190-2199,U+2212,U+2215}
@font-face{font-family:"AB Mono";src:url(/fonts/jetbrainsmono-regular.woff2) format("woff2");font-weight:100 449;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02C6,U+02DA,U+02DC,U+2000-2013,U+2015-2017,U+201E-2025,U+2027-206F,U+2074,U+20AC,U+2122,U+2190-2199,U+2212,U+2215,U+2500-25FF}
@font-face{font-family:"AB Mono";src:url(/fonts/jetbrainsmono-medium.woff2) format("woff2");font-weight:450 649;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02C6,U+02DA,U+02DC,U+2000-2013,U+2015-2017,U+201E-2025,U+2027-206F,U+2074,U+20AC,U+2122,U+2190-2199,U+2212,U+2215,U+2500-25FF}
@font-face{font-family:"AB Mono";src:url(/fonts/jetbrainsmono-bold.woff2) format("woff2");font-weight:650 900;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02C6,U+02DA,U+02DC,U+2000-2013,U+2015-2017,U+201E-2025,U+2027-206F,U+2074,U+20AC,U+2122,U+2190-2199,U+2212,U+2215,U+2500-25FF}
:root{
  --sans:"AB Inter","Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",system-ui,sans-serif;
  --serif:var(--sans);
  --mono:"AB Mono",Consolas,"Cascadia Mono","SFMono-Regular",Menlo,"Microsoft YaHei UI","PingFang SC","Noto Sans SC",monospace;
}
/* 数字等宽对齐（时间、计数、会话号）；正文段落里保持比例数字 */
body{font-variant-numeric:tabular-nums}
.md,.bub .bx{font-variant-numeric:normal}
.bub.a{font-size:15px;line-height:1.72}
.srow .sub{font-family:var(--sans)}
code,pre,kbd,samp,.mono,.md code,.md pre,.tcall pre,.tcall .tn,.tcall .ta,.tools .tgl,.cxb pre,.cxc,.cxf,.cxterm .cxcmd,.cxdiff,.trhead code,.splt,.dlg pre{
  font-family:var(--mono);font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0;tab-size:4;-moz-tab-size:4}
.meta .mono{font-size:.95em}
/* 代码块：不折行，块里横向滚动（不撑宽页面）；行高 1.5 */
.md pre,.tcall pre,.cxb pre,.cxterm .cxcmd{white-space:pre;word-break:normal;overflow-wrap:normal;overflow:auto;max-width:100%;line-height:1.5}
.md pre{font-size:13px}
.tcall pre,.cxb pre{font-size:12.5px}
.cxterm .cxcmd{font-size:12.5px}
.md .cb,.tcall .tio,.cxb,.cxterm,.cxdiff{min-width:0;max-width:100%}
.md pre::-webkit-scrollbar,.tcall pre::-webkit-scrollbar,.cxb pre::-webkit-scrollbar,.cxterm .cxcmd::-webkit-scrollbar{height:8px;width:8px}
.md pre::-webkit-scrollbar-thumb,.tcall pre::-webkit-scrollbar-thumb,.cxb pre::-webkit-scrollbar-thumb,.cxterm .cxcmd::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--codefg) 25%,transparent);border-radius:8px}
.md code{font-size:.88em}
.cxdiff pre{padding:6px 0;width:100%;box-sizing:border-box}
.cxdiff .dl{min-width:max-content;padding-right:16px}
/* ---------- Codex 桌面版的样子（浅色按用户截图取色）：白底、浅灰侧栏、薄荷绿用户气泡、助手纯文字、灰色分隔标签 ---------- */
.cx{
  --bg:#ffffff;--panel:#ffffff;--panel2:#fafbfc;--side:#f9fbfd;--hover:#f1f3f5;--hover2:#eceff1;--bubble:#e2f2e6;--ubtext:#1c351d;
  --line:#e4e7ea;--line2:#ededed;--sidel:#dee3e7;--text:#1a1c1f;--muted:#6c6d6f;--faint:#8e8f90;--chip:#e9eaea;--quote:#e4e4e5;
  --accent:#1a1c1f;--accent-weak:#eceff1;--ink:#1a1c1f;--ink-on:#ffffff;--codex:#1a1c1f;--go:#6ab364;--go-on:#ffffff;--warm:#d16127;
  --codebg:#f7f8f9;--codefg:#1a1c1f;--codemuted:#6c6d6f;--cxadd:#1a7f37;--cxdel:#cf222e;--cxaddbg:#e6f4ea;--cxdelbg:#fdecec;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cx{
  --bg:#181818;--panel:#363636;--panel2:#202020;--side:#1e1c20;--hover:#262428;--hover2:#2f2c31;--bubble:#3a6638;--ubtext:#f1faf3;
  --line:#3b3b3b;--line2:#2c2c2c;--sidel:#2a272c;--text:#f2f2f2;--muted:#b4b4b4;--faint:#8b8b8b;--chip:#303030;--quote:#3c3c3c;
  --accent:#f2f2f2;--accent-weak:#2f2c31;--ink:#f2f2f2;--ink-on:#181818;--codex:#f2f2f2;--go:#4f8a4a;--go-on:#ffffff;--warm:#c1784e;
  --codebg:#111111;--codefg:#e6e6e6;--codemuted:#8f8f8f;--cxadd:#5cc37a;--cxdel:#f2777a;--cxaddbg:#16301f;--cxdelbg:#3a1b1d;--cxbar:#6ab364;--cinb:#3b3b3b;}}
:root[data-theme="dark"] .cx{
  --bg:#181818;--panel:#363636;--panel2:#202020;--side:#1e1c20;--hover:#262428;--hover2:#2f2c31;--bubble:#3a6638;--ubtext:#f1faf3;
  --line:#3b3b3b;--line2:#2c2c2c;--sidel:#2a272c;--text:#f2f2f2;--muted:#b4b4b4;--faint:#8b8b8b;--chip:#303030;--quote:#3c3c3c;
  --accent:#f2f2f2;--accent-weak:#2f2c31;--ink:#f2f2f2;--ink-on:#181818;--codex:#f2f2f2;--go:#4f8a4a;--go-on:#ffffff;--warm:#c1784e;
  --codebg:#111111;--codefg:#e6e6e6;--codemuted:#8f8f8f;--cxadd:#5cc37a;--cxdel:#f2777a;--cxaddbg:#16301f;--cxdelbg:#3a1b1d;--cxbar:#6ab364;--cinb:#3b3b3b;}
/* 深色版（照 Codex 桌面版深色截图）：正文区左边一条细绿线；分隔线 #3c3c3c；输入框是深灰实心块 */
.center.cx{box-shadow:inset 2px 0 var(--cxbar,transparent)}
.cx .md hr{border:0;border-top:1px solid var(--quote)}
.cx .md h1,.cx .md h2,.cx .md h3,.cx .md h4{font-weight:700;color:var(--text)}
/* 侧栏 */
.side.cx{background:var(--side)}
.cx .card h3{color:var(--faint);font-weight:500}
.cx .srow{border-radius:8px;padding:5px 8px}
.cx .srow:hover{background:var(--hover)}
.cx .srow.open{background:var(--hover2);box-shadow:none}
.cx .srow .nm{font-weight:400;font-size:13.5px;color:var(--text)}
.cx .srow .sub{color:var(--faint)}
/* 标题栏：文件夹图标 + 标题，不要分隔线 */
.center.cx .trhead{border-bottom:0;background:var(--bg)}
.center.cx .trhead .nm{font-weight:500;font-size:14px;color:var(--text)}
.center.cx .trhead code{background:transparent;color:var(--faint);padding:0}
/* 正文：居中阅读栏，助手纯文字，用户薄荷绿圆角气泡 */
.center.cx .trv{gap:6px;padding-left:max(20px,calc((100% - 680px) / 2));padding-right:max(20px,calc((100% - 680px) / 2))}
.cx .bub.a{font:14px/1.75 var(--sans);color:var(--text);padding:2px 0}
.cx .bub.u,.cx .bub.u.viabus{background:var(--bubble);color:var(--ubtext);border-radius:18px;padding:9px 15px;font:14px/1.6 var(--sans);max-width:min(560px,82%);box-shadow:none;margin-top:12px}
.cx .bub.u .bvia{color:color-mix(in srgb,var(--ubtext) 62%,transparent)}
.cx .bub .bt{color:var(--faint)}
.cx .trv .day{color:var(--faint);font-size:12px;letter-spacing:0;margin:18px 0 8px}
.cx .md code{background:var(--chip);border:0;color:var(--text);border-radius:6px;padding:.1em .4em;font-size:.86em}
.cx .md pre code{background:none;padding:0}
.cx .md blockquote{border-left:3px solid var(--quote);color:var(--text);padding-left:14px}
.cx .md strong{font-weight:600}
.cx .md a{color:var(--text);text-decoration:underline;text-decoration-color:var(--faint)}
/* 「已处理 / 运行了 N 条命令」：灰色标签，下面一条细线；单条动作：灰字 + 终端图标 */
.cx .cxg{margin:10px 0 6px}
.cx .cxg>summary{border-bottom:1px solid var(--line2);border-radius:0;padding:4px 0 7px;color:var(--faint)}
.cx .cxg>summary:hover{background:transparent;color:var(--muted)}
.cx .cxg .cxv{color:var(--faint);font-weight:400}
.cx .cxt>summary{color:var(--muted);padding:3px 0}
.cx .cxt>summary:hover{background:transparent;color:var(--text)}
.cx .cxv{font-weight:400}
.cx .cxc{background:transparent;border:0;padding:0;color:var(--muted)}
.cx .buscard{background:var(--panel2);border-color:var(--line2)}
/* 输入框：大圆角白框 + 细边 + 柔和阴影，发送键绿色圆钮 */
.center.cx .compose{background:var(--bg)}
.center.cx .cin{background:var(--panel);border:1px solid var(--cinb,var(--line2));border-radius:22px;box-shadow:0 2px 6px rgba(0,0,0,.03),0 8px 24px rgba(0,0,0,.06);padding:8px 8px 8px 18px}
.center.cx .cin:focus-within{border-color:var(--line)}
.center.cx .cin textarea{font-size:14.5px}
.center.cx .cin textarea::placeholder{color:var(--faint)}
.center.cx #sendBtn,.center.cx .cin button.primary{background:var(--go);color:var(--go-on);border-radius:999px;padding:7px 16px;font-weight:500}
.center.cx .seg{background:var(--hover)}
.center.cx .seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.center.cx #toFixed b{color:var(--text)}

/* 消息总线：你经总线发给 Claude 的（用户气泡 + 「经总线」）、别的会话发来的（收件卡片）、会话自己发出去的（发件卡片） */
.bub.u.viabus{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 40%,transparent)}
.bub.u.pend{opacity:.72}
.bvia{display:flex;align-items:center;gap:4px;font:11.5px/1.4 var(--sans);color:var(--muted);margin-bottom:3px;min-width:0}
.bvia .ic{width:13px;height:13px;flex:none}
.buscard{flex:none;align-self:flex-start;width:min(680px,92%);box-sizing:border-box;border:1px solid var(--line);border-radius:12px;background:var(--panel2);font:13.5px/1.55 var(--sans);margin:6px 0;overflow:hidden;min-width:0}
.buscard.out{align-self:flex-end;border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.buscard .bch{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12.5px;min-width:0}
.buscard .bch .ic{width:14px;height:14px;flex:none}
.buscard .bch b{color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.buscard .bck{flex:none;padding:0 7px;border-radius:999px;background:var(--line2);font-size:11.5px;white-space:nowrap}
.buscard .bst{margin-left:auto;flex:none;font-size:11.5px;color:var(--faint);white-space:nowrap}
.buscard .bst.err{color:var(--bad)}
.buscard .bcx{padding:7px 11px;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;color:var(--text)}
.buscard.clamp .bcx{max-height:12em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent)}
.buscard .more{display:inline-block;margin:0 11px 6px;font-size:12.5px}
.buscard .bcraw>summary{cursor:pointer;padding:0 11px 6px;font-size:12px;color:var(--faint);list-style:none;display:inline-block}
.buscard .bcraw>summary::-webkit-details-marker{display:none}
.buscard .bcraw pre{margin:0 11px 8px;max-height:16em;overflow:auto;font:12px/1.5 var(--mono);background:var(--line2);padding:6px 8px;border-radius:6px;white-space:pre-wrap;overflow-wrap:anywhere}
.cx .buscard{border-radius:10px;font-size:13.5px}
@media (max-width:700px){.buscard{width:96%}}
/* 会话状态图例：放在顶栏，一份（Claude + Codex 合计，当前项目在线的）；窄屏只留点和数字，手机收进状态点弹出的那块 */
.slegend{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--muted);white-space:nowrap;flex:none;cursor:default}
.slegend>span{display:inline-flex;align-items:center;gap:5px}
.slegend b{font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.slegend .z{opacity:.55}
.plegend{display:none}
@media (max-width:1279px) and (min-width:861px){#sLegend{gap:9px}#sLegend .lb{display:none}}
body:not(.lg-top) #sLegend,body:not(.lg-top) .plegend{display:none!important}
/* 贴窗口底部：每个会话栏最下面一条，不跟着列表滚 */
.sfoot{display:none}
body.lg-bottom .sfoot{display:flex;position:sticky;bottom:0;margin-top:auto;z-index:3;padding:7px 14px calc(7px + env(safe-area-inset-bottom));
  background:var(--side,var(--panel));border-top:1px solid var(--line2);font-size:11.5px;gap:12px}
@media (min-width:861px){body.lg-bottom .side{display:flex;flex-direction:column}body.lg-bottom .side>.card{flex:none}}
@media (max-width:860px){
  #sLegend{display:none!important}
  .top.showpills .plegend{display:flex;flex-basis:100%;gap:14px;font-size:13px;padding-top:2px}
  body.lg-bottom.m-sess .side:not(.sideL){display:flex;flex-direction:column}
  body.lg-bottom .side>.card{flex:none}
  body.lg-bottom .sfoot{font-size:13px;padding:9px 16px}
}
/* 设置弹窗 */
.setbtn{border:0;background:transparent;color:var(--muted);padding:4px 6px;display:inline-flex;align-items:center}
.setbtn:hover{background:var(--hover);color:var(--text)}
.setbtn .ic{width:17px;height:17px}
.setlist{display:flex;flex-direction:column;gap:2px;min-width:min(460px,80vw)}
.setrow{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.setrow:last-child{border-bottom:0}
.setrow .sl{display:flex;gap:10px;align-items:flex-start;flex:1 1 200px;min-width:0}
.setrow .sl .ic{width:16px;height:16px;color:var(--muted);margin-top:2px;flex:none}
.setrow .sd{font-size:12px;color:var(--muted);margin-top:1px}
.setrow .seg{flex:none}
.setrow .seg button{font-size:12.5px;padding:4px 12px}
@media (max-width:860px){.setbtn{font-size:19px;padding:4px 8px}.setbtn .ic{width:20px;height:20px}}

</head>
<body>
<div class="app">
  <header class="top">
    <span class="brand" id="brand" title="回到总线消息"><i data-ic="messages"></i><span class="btx"> 会话消息总线</span><span id="phoneTag" style="display:none;font-weight:400;font-size:12px;color:var(--muted)"> · 手机</span></span>
    <select class="projsel" id="projSel" title="切换项目"></select>
    <button class="stdot mob" id="stDot" title="状态"></button>
    <div class="pills" id="pills"></div>
    <div class="slegend" id="sLegend"></div>
    <div class="topact">
      <button class="thbtn" id="themeBtn" title="主题"></button>
      <button class="setbtn" id="setBtn" title="设置"><i data-ic="gear"></i></button>
      <button class="rf" id="refreshAll" data-refresh title="刷新（会话、消息、当前会话记录）" style="font-size:17px"><i data-ic="refresh"></i></button>
      <button class="primary admin" id="instBtn" style="display:none"></button>
      <div class="menu" id="menu">
        <button class="ghost" id="menuBtn" title="更多"><i data-ic="more"></i></button>
        <div class="list">
          <button id="mPhone" class="admin"><i data-ic="phone"></i>手机端（扫码）…</button>
          <button id="mAdd" class="admin"><i data-ic="plus"></i>添加项目…</button>
          <button id="mSM" class="admin"><i data-ic="listx"></i>会话管理（搜索 / 归档 / 删除 / 还原）…</button>
          <button id="mCSync" class="admin needcdesk" title="这台电脑上没装 Claude 桌面端时不显示"><i data-ic="sync"></i>同步 Claude 会话到当前账号…</button>
          <button id="mXSync" class="admin"><i data-ic="download"></i>把 Codex 对话同步进 Claude…</button>
          <button id="mInst" class="admin"><i data-ic="wrench"></i>安装 / 升级 / 修复</button>
          <button id="mTest" class="admin"><i data-ic="activity"></i>自检</button>
          <button id="mRm" class="admin"><i data-ic="listx"></i>从列表移除</button>
          <button id="mUninst" class="danger admin"><i data-ic="trash"></i>卸载…</button>
          <hr class="admin" style="border:0;border-top:1px solid var(--line);margin:4px 0">
          <button id="mFxTest" class="admin needfx"><i data-ic="play"></i>试放桌面信件动画</button>
          <button id="mBrowser"><i data-ic="external"></i>在浏览器中打开</button>
          <button id="mSet"><i data-ic="gear"></i>设置…</button>
        </div>
      </div>
    </div>
  </header>

  <div class="body">
    <aside class="side sideL" id="colL"><div class="sfoot slegend" id="footL"></div></aside>
    <section class="center">
      <div>
        <div class="banner" id="banner" style="display:none"></div>
        <div class="banner" id="pauseBanner" style="display:none"></div>
        <div class="trhead" id="trHead" style="display:none"></div>
        <div class="filters" id="filters">
          <span class="chip on" data-f="all">全部<span class="n" id="nAll"></span></span>
          <span class="chip" data-f="msg">消息<span class="n" id="nMsg"></span></span>
          <span class="chip" data-f="task">任务<span class="n" id="nTask"></span></span>
          <button class="ghost mob" id="qBtn" title="搜索"><i data-ic="search"></i></button>
          <input id="q" placeholder="搜索消息内容 / 编号 / 会话名">
        </div>
      </div>
      <div class="stream" id="stream"><div class="empty">正在加载…</div></div>
      <div class="stream trv" id="trView" style="display:none"></div>
      <button class="newpill" id="newPill">有新消息 <i data-ic="down"></i></button>
      <div class="compose" id="compose">
        <div class="crow">
          <span id="toWrap"><span>发给</span> <select id="to"></select></span>
          <span id="toFixed" style="display:none"></span>
          <label id="wakeWrap" title="给 Codex 会话发时，用 codex queue 排一条提醒叫醒它"><input type="checkbox" id="wake" checked> 叫醒 Codex</label>
          <span class="hint" id="hint">Ctrl+Enter 发送</span>
        </div>
        <div class="cin">
          <textarea id="text" rows="1" placeholder="以「用户」身份发消息…"></textarea>
          <button class="primary" id="sendBtn">发送</button>
        </div>
      </div>
    </section>

    <aside class="side" id="colR">
      <div class="card sesscard" id="cardClaude">
        <h3><span class="a-claude"><i data-ic="claude" data-cls="logo"></i>Claude</span> 会话 <span id="nClaude"></span><button class="rf" data-refresh title="刷新会话列表"><i data-ic="refresh"></i></button><span class="sp winpos" id="posClaude"></span></h3>
        <div id="sessClaude"><div class="grp">加载中…</div></div>
      </div>
      <div class="card sesscard" id="cardCodex">
        <h3><span class="a-codex"><i data-ic="codex" data-cls="logo"></i>Codex</span> 会话 <span id="nCodex"></span><button class="rf" data-refresh title="刷新会话列表"><i data-ic="refresh"></i></button><span class="sp winpos" id="posCodex"></span></h3>
        <div id="codexSt" class="grp" style="margin:0 0 4px"></div>
        <div id="sessCodex"><div class="grp">加载中…</div></div>
      </div>
      <div class="sfoot slegend" id="footR"></div>
    </aside>
  </div>
  <nav class="mnav" id="mnav">
    <button data-m="bus" class="on"><i data-ic="chat"></i><span>消息</span><i id="bNav"></i></button>
    <button data-m="sess"><i data-ic="users"></i><span>会话</span><i id="sNav"></i></button>
  </nav>
</div>

<div class="toast" id="toast"></div>
<div id="updBar" class="admin"></div>
<div class="dlg" id="dlg"><div class="box">
  <div class="hd"><span id="dlgTitle"></span><button class="ghost" onclick="closeDlg()"><i data-ic="x"></i></button></div>
  <div class="bd" id="dlgBody"></div>
  <div class="ft" id="dlgFt"><button onclick="closeDlg()">关闭</button></div>
</div></div>

function stateOf(p){
  if (p.exists === false) return ["bad","目录不存在"];
  if (!p.bus_dir) return ["", "未安装"];
  if (!p.installed) return ["warn","钩子不全"];
  if (p.hook_py_missing) return ["warn","总线可修复"];
  if ((p.codex_trusted||[]).length < (p.codex_total||3)) return ["warn","待信任 Codex 钩子"];
  if (p.bus_outdated) return ["warn","可升级"];
  return ["ok","就绪"];
}

function legendHtml(list){
  const n = {stand: 0, active: 0, idle: 0}; list.forEach(x => n[sessState(x)[0]]++);
  const TIP = {stand: "待命：在线、闲着等消息（来消息会被叫醒）", active: "活跃：正在干活，或 3 分钟内有动静", idle: "空闲：一阵没动静了"};
  return [["stand", "待命"], ["active", "活跃"], ["idle", "空闲"]].map(([k, t]) =>
    `<span class="${n[k] ? "" : "z"}" title="${TIP[k]}（${n[k]} 个）"><i class="dot d-${k}"></i><span class="lb">${t}</span><b>${n[k]}</b></span>`).join("");
}

async function select(root){

  const moved = cur && cur.root !== root;
  if (moved) xpSess[cur.root] = sessList;                       // 切走的项目：它的会话留在自己的文件夹里
  cur = np; const cached = xpSess[root]; delete xpSess[root];
  if (moved) { setFold("claude", root, true); setFold("codex", root, true); }  // 切到哪个项目，它的文件夹就展开（刷新页面时照记下的开合）
  store.set("msgbus.cur", root); $("#projSel").value = root;
  offset = -1; msgs = []; sessList = cached || []; view = null; applyMode(); markOpen();
