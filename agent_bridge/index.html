function openUrl(u){ try { if (window.pywebview && pywebview.api.open_url) return pywebview.api.open_url(u); } catch(e) {} window.open(u, "_blank"); }
function renderUpd(){
  const el = $("#updBar"); if (!el) return;
  const d = upd.download || {};
  const busy = ["downloading", "verifying", "ready", "installing"].includes(d.state);
  const show = isLocal && upd.newer && (busy || store.get("msgbus.updSkip") !== upd.latest);
  el.classList.toggle("show", !!show);
  if (!show) return;
  const pct = d.total ? Math.min(100, Math.round(d.done * 100 / d.total)) : 0;
  let body = "", btns = "";
  if (d.state === "downloading" || d.state === "verifying") {
    body = `<div style="color:var(--muted);margin-top:6px">${d.state === "verifying" ? "校验中…" : `下载中 ${pct}%（${(d.done/1048576).toFixed(1)} / ${(d.total/1048576).toFixed(1)} MB）`}</div><div class="updprog"><i style="width:${pct}%"></i></div>`;
  } else if (d.state === "ready") {
    body = `<div style="color:var(--muted);margin-top:6px">已下好并校验通过。安装时程序会关掉，装完自动重新打开（会话之间照常互发消息）。</div>`;
    btns = `<button class="primary" id="updGo">安装并重启</button>`;
  } else if (d.state === "installing") {
    body = `<div style="color:var(--muted);margin-top:6px">正在安装，程序马上会关掉、装完自动重开…</div>`;
  } else {
    if (d.state === "error") body += `<div style="color:var(--bad);margin-top:6px">${esc(d.error || "下载失败")}</div>`;
    btns = upd.mode === "installer" && upd.has_setup ? `<button class="primary" id="updNow">立即更新</button>`
         : upd.mode === "installer" ? `<span style="color:var(--muted)">这个版本没有安装包</span>`
         : `<span style="color:var(--muted)">源码版：在程序目录 <code>git pull</code> 后重启</span>`;
    btns = (upd.page ? `<button id="updPage">发布页</button>` : "") + btns;
  }
  el.innerHTML = `<div class="uh">${ic("download")}<span>新版本 ${esc(upd.latest)} 可用</span><span style="color:var(--muted);font-weight:400">（当前 ${esc(upd.current)}）</span>
      ${busy ? "" : `<button class="x" id="updX" title="这个版本先不提醒">${ic("x")}</button>`}</div>
    ${upd.notes ? `<details><summary>更新说明</summary><pre>${esc(upd.notes)}</pre></details>` : ""}${body}<div class="ub">${btns}</div>`;
  const on = (id, f) => { const b = $("#" + id); if (b) b.onclick = f; };
  on("updX", () => { store.set("msgbus.updSkip", upd.latest); renderUpd(); });
  on("updPage", () => openUrl(upd.page));
  on("updNow", async () => { try { updGoAfter = true; upd = await api("/api/update/download", {}); renderUpd(); pollUpd(); } catch(e) { updGoAfter = false; toast("❌ " + e.message); } });

function pickBar(n, nid = "pickN"){ return n ? `<div class="pickbar" style="display:flex;gap:8px;align-items:center;margin:6px 0">
  <button class="ghost" data-pick="all">全选</button><button class="ghost" data-pick="invert">反选</button>

function wirePick(goId, label, extra = 0, scope = "#dlg", nid = "pickN"){   // extra：不用勾、总会一起做的条数（如要刷新的）
  const boxes = () => $$(scope + " input[data-pickrow]:not(:disabled)");
  const sync = () => { const n = boxes().filter(b => b.checked).length, total = boxes().length;
    if ($("#" + nid)) $("#" + nid).textContent = `已选 ${n} / ${total}`;
    const go = $("#" + goId); if (go) { go.disabled = !n && !extra;
      go.textContent = n ? `${label} ${n} 个` + (extra ? `，刷新 ${extra} 个` : "") : `刷新 ${extra} 个`; } };
  $$(scope + " [data-pick]").forEach(b => b.onclick = () => {
    boxes().forEach(x => x.checked = b.dataset.pick === "all" ? true : !x.checked); sync(); });
  boxes().forEach(x => x.onchange = sync);
  sync();
  return () => boxes().filter(b => b.checked).map(b => b.value);
}

function spSt(i){
  if (["done", "failed", "stopped"].includes(i.status)) return i.status;
  const last = i.last || i.ts || 0;
  return last && Date.now()/1000 - last > 900 ? "idle" : "running";
}
function spIcon(st){ return st === "running" ? '<span class="spinr"></span>' : st === "done" ? ic("check", "ok") : st === "failed" ? ic("err") : ic("pause"); }
function spDur(i, st){
  if (i.duration) return i.duration;
  const s = i.started || i.ts; if (!s) return 0;
  return Math.max(0, (st === "running" ? Date.now()/1000 : (i.last || s)) - s);
}
function spMeta(i, st){ const d = spDur(i, st);
  return [SUB_LABEL[st], d ? fmtDur(d) : "", i.tools != null ? `${i.tools} 次工具调用` : ""].filter(Boolean).join(" · "); }
function spBtnUpdate(){
  const b = $("#spBtn"); if (!b) return;
  const n = spItems.length, run = spItems.filter(i => spSt(i) === "running").length;
  b.style.display = n ? "" : "none";
  $("#spN").textContent = n;
  $("#spRun").innerHTML = run ? `<span class="spinr"></span>${run}` : "";
  b.title = n ? `这个会话派出去 ${n} 个子任务${run ? `，${run} 个还在跑` : ""}；点开查看` : "";
  b.classList.toggle("on", spOpenP);
}
function spOnOpen(x, same){
  if (!same || spKey !== tabKey(x)) { spItems = []; spLoaded = false; spKey = tabKey(x); spClose(); }
  spBtnUpdate(); spPoll(true);
}
function spShow(){ spOpenP = true; spPanel.classList.add("open"); spPanel.setAttribute("aria-hidden", "false"); spRender(); spBtnUpdate(); spPoll(true); }
function spClose(){ spOpenP = false; spSel = null; spPanel.classList.remove("open"); spPanel.setAttribute("aria-hidden", "true"); spBtnUpdate(); }
async function spPoll(force){
  const v = view;
  if (!v || v.agent !== "claude") { if (spOpenP) spClose(); if (!v) spItems = []; spBtnUpdate(); return; }
  if (spKey !== tabKey(v)) return;
  if (spBusy || (!force && Date.now() - spLast < (spOpenP ? 2000 : 6000))) return;
  spBusy = true; spLast = Date.now();
  try {
    const r = await api(`/api/transcript/subtask-list?${trQ(v)}`);
    if (view !== v) return;
    spItems = r.items || []; spLoaded = true; spBtnUpdate();
    if (spOpenP) { if (spSel) await spDetailFetch(v); if (view === v) spRender(); }
  } catch(e) {} finally { spBusy = false; }
}
async function spDetailFetch(v){
  const id = spSel, it = spItems.find(i => i.id === id); if (!it) return false;
  const s = trSubs[id] || (trSubs[id] = {ts: it.ts});
  if (!s.agent && it.agent) s.agent = it.agent;
  const tr = trSubTr[id];
  if (tr && tr.loaded && spSt(it) !== "running") return false;
  return subFetch(id, v);
}
function spRowHtml(i){
  const st = spSt(i);
  return `<div class="sprow st-${st}${i.id === spSel ? " sel" : ""}" data-spid="${esc(i.id)}" title="${esc(i.description || "")}">
    <span class="sts">${spIcon(st)}</span>
    <div class="spm"><div class="sp1"><span class="stb">${esc(i.subagent_type || "子代理")}</span>${i.bg ? '<span class="spbg">后台</span>' : ""}<span class="spd">${esc(i.description || "子任务")}</span></div>
      <div class="sp2">${spMeta(i, st)}${i.ts ? ` · ${hm(i.ts)} 派出` : ""}</div>
      ${st === "running" && i.last_tool ? `<div class="splt">${esc(i.last_tool)}</div>` : ""}</div>
    <span class="spgo">${ic("chev")}</span></div>`;
}
function spListHtml(){
  if (!spLoaded) return `<div class="empty">正在读子任务…</div>`;
  if (!spItems.length) return `<div class="empty">这个会话没有派过子任务</div>`;
  let html = "";
  for (let k = 0; k < spItems.length; ) {      // 同一条回复里派的（并行）放一组
    let j = k + 1; while (j < spItems.length && spItems[j].batch === spItems[k].batch) j++;
    const grp = spItems.slice(k, j);
    if (grp.length > 1) { const done = grp.filter(i => spSt(i) === "done").length;
      html += `<div class="spgrp"><div class="spgh">${ic("users")} 并行 ${grp.length} 个 · 完成 ${done}</div>${grp.map(spRowHtml).join("")}</div>`; }
    else html += spRowHtml(grp[0]);
    k = j;
  }
  return html;
}
function spDetailHtml(it){
  const st = spSt(it), id = it.id, tr = trSubTr[id];
  const conv = !it.agent ? '<div class="empty">还没拿到子代理的记录（老版本 Claude Code 或记录已清理时找不到）</div>'
    : !tr ? '<div class="empty">正在读子代理的记录…</div>'
    : tr.missing ? '<div class="empty">找不到这个子代理的记录文件</div>'
    : trListHtml(tr.entries, "sp/" + id + "/", true);
  const dk = "spP:" + id, res = it.result;
  return `<div class="spdh"><span class="sts">${spIcon(st)}</span><span class="stb">${esc(it.subagent_type || "子代理")}</span>${it.bg ? '<span class="spbg">后台</span>' : ""}
      <span class="spdm">${spMeta(it, st)}</span><a class="link" data-sploc="${esc(id)}">在对话中定位</a></div>
    <div class="spdd">${esc(it.description || "子任务")}</div>
    ${it.prompt ? `<details class="spsec" data-dk="${esc(dk)}" ${trDet.has(dk) ? "open" : ""}><summary class="lbl">提示词（${it.prompt.length} 字）</summary><pre class="sppr">${esc(it.prompt)}</pre></details>` : ""}
    <div class="lbl">过程${st === "running" && it.last_tool ? ` · 正在 ${esc(it.last_tool)}` : ""}</div>
    <div class="spconv">${conv}</div>
    <div class="lbl">结果</div>
    ${res ? `<div class="spres md">${mdHtml(res)}</div>` : `<div class="empty">${st === "running" ? "还在跑，跑完这里会出现它交回来的报告" : "没有拿到结果"}</div>`}`;
}
function spRender(){
  if (!spOpenP) return;
  const body = $("#spBody"), top = body.scrollTop;
  const it = spSel && spItems.find(i => i.id === spSel);
  if (spSel && !it && spLoaded) spSel = null;
  $("#spBack").style.display = spSel ? "" : "none";
  if (spSel && it) {
    $("#spTitle").textContent = it.description || "子任务";
    $("#spSub").textContent = "";
    body.innerHTML = spDetailHtml(it);
  } else {
    const run = spItems.filter(i => spSt(i) === "running").length;
    $("#spTitle").textContent = "子任务";
    $("#spSub").textContent = spLoaded ? `${spItems.length} 个${run ? ` · ${run} 个进行中` : ""}` : "";
    body.innerHTML = spListHtml();
  }
  body.scrollTop = top;
}
function spLocate(id){
  const el = [...$$("#trView .subtask[data-subid]")].find(x => x.dataset.subid === id && !x.parentElement.closest(".subtask"));
  if (!el) { toast("这个子任务在比较早的对话里，主视图只载入了最近一段，定位不到；详情在面板里看就行", 4200); return; }
  if (innerWidth < 1100) spClose();
  trFlash = {id, until: Date.now() + 2600};
  el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 2600);
  el.scrollIntoView({block: "center", behavior: "smooth"});
}
$("#spX").onclick = spClose;
$("#spBack").onclick = () => { spSel = null; spRender(); $("#spBody").scrollTop = spListTop; };
$("#spBody").addEventListener("click", e => {
  const loc = e.target.closest("[data-sploc]"); if (loc) { e.preventDefault(); spLocate(loc.dataset.sploc); return; }
  const row = e.target.closest("[data-spid]");
  if (row) { spListTop = $("#spBody").scrollTop; spSel = row.dataset.spid; spRender(); $("#spBody").scrollTop = 0;
    const v = view; spDetailFetch(v).then(() => { if (view === v) spRender(); }); return; }
  trClick(e, spRender);
});
$("#spBody").addEventListener("toggle", trToggle, true);
document.addEventListener("keydown", e => { if (e.key === "Escape" && spOpenP) { e.preventDefault(); spClose(); } });
setInterval(() => spPoll(false), 2000);

// ---------- 发送 ----------
// 输入框只有一个「发送」：发的都是普通消息（派活 / 任务看板去掉了；会话之间自己派的活照样在消息流里显示）
function setPh(){
  const nm = view ? (view.alias || view.title || "它") : "";
  $("#text").placeholder = view ? (view.agent === "codex" ? "与 Codex 协作" : `发给 ${nm}…`) : "以「用户」身份发消息…";
  $("#sendBtn").textContent = "发送"; }
function autoGrow(){ const t=$("#text"); t.style.height="auto"; t.style.height=Math.min(t.scrollHeight, 200)+"px"; }
$("#text").addEventListener("input", autoGrow);
$("#text").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $("#sendBtn").click(); } });
$("#sendBtn").onclick = async () => {
  const text = $("#text").value.trim(); if (!text || !cur) return;
  const b = $("#sendBtn"); b.disabled = true;
  if (view) {
    try { const r = await api("/api/reply", {root:cur.root, agent:view.agent, sid:view.sid, text, kind:"msg"});
      if (r.ok) { $("#text").value = ""; autoGrow();
        // Claude / Cursor 收的是总线消息，进它的记录要等它收到；先在这里放一个「已发出」的气泡，收到后换成真的
        const mid = (String(r.output || "").match(/已发送(?:消息|任务)\s+([0-9a-f]{12})/) || [])[1];
        if (view.agent !== "codex" && mid) { trPending.push({vk: tabKey(view), text, kind:"msg", mid, ts: Date.now() / 1000}); trRender(true); }
        toast(r.via==="codex-queue" ? "已交给 Codex（作为用户输入）" : "已经总线送达 Claude（标成你本人发的）"); }
      else openDlg("❌ 没发出去", `<pre>${esc(r.output)}</pre>`);
    } catch(e){ toast("❌ 发送失败：" + e.message, 5000); }
    b.disabled = false; setTimeout(() => pollTranscript(), 1500);
    return;
  }
  try { const r = await api("/api/send", {root:cur.root, to:$("#to").value, text, wake:$("#wake").checked, kind:"msg"});
    if (r.ok) { $("#text").value = ""; autoGrow();
      const woke = (r.output.match(/已排队叫醒/g)||[]).length;
      toast("已发送" + (woke?`，叫醒了 ${woke} 个 Codex 会话`:"")); }
    else openDlg("❌ 没发出去", `<pre>${esc(r.output)}</pre>`);
  } catch(e){ toast("❌ 发送失败：" + e.message, 5000); }
  b.disabled = false; pollMessages();
};

// ---------- 轮询 ----------
function stopPolling(){ timers.forEach(clearInterval); timers = []; }
function startPolling(){
  stopPolling(); pollMessages(); pollSessions(); pollCodex(); pollOtherSessions();
  timers.push(setInterval(pollMessages, 1500), setInterval(pollSessions, 6000), setInterval(pollCodex, 15000), setInterval(loadProjects, 20000), setInterval(pollOtherSessions, 20000), setInterval(pollTranscript, 2000));
}
(async () => {
  await loadMe();
  loadUpdate(); setTimeout(loadUpdate, 20000); setInterval(loadUpdate, 30 * 60 * 1000);   // 启动后服务会在后台查一次
  await loadProjects();
  const last = store.get("msgbus.cur");
  const pick = projects.find(p => p.root === last) || projects[0];
  if (pick) select(pick.root);
  else { $("#stream").innerHTML = `<div class="empty">还没有项目。点右上角 ⋯ →「添加项目」。</div>`; $("#compose").style.display="none"; }
})();
</script>
