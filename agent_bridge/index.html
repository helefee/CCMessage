/* 0.4.2：Codex 会话名用深绿（像 Claude 会话名用 Claude 橙）；副标题照旧灰色 */
:root{--cxn:#1e6b34}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cxn:#7cc982}}
:root[data-theme="dark"]{--cxn:#7cc982}
.srow .nm.a-codex,.cx .srow .nm.a-codex,.cx .srow.open .nm.a-codex,.srow.open .nm.a-codex{color:var(--cxn)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="sbtg" id="tgL" aria-pressed="true"><i data-ic="panelL"></i><span class="sdot"></span></button>
    <span class="brand" id="brand" title="回到总线消息"><i data-ic="messages"></i><span class="btx"> CC Msg</span><span id="phoneTag" style="display:none;font-weight:400;font-size:12px;color:var(--muted)"> · 手机</span></span>
    <span class="curnm" id="curNm"></span>
    <button class="stdot mob" id="stDot" title="状态"></button>
    <div class="pills" id="pills"></div>
    <div class="slegend" id="sLegend"></div>
    <div class="topact">
      <button class="thbtn" id="themeBtn" title="主题"></button>
      <button class="setbtn" id="setBtn" title="设置"><i data-ic="gear"></i></button>
      <button class="rf" id="refreshAll" data-refresh title="刷新（会话、消息、当前会话记录）" style="font-size:17px"><i data-ic="refresh"></i></button>
      <button class="primary admin" id="instBtn" style="display:none"></button>
      <div class="menu" id="menu">
        <button class="ghost" id="menuBtn" title="更多"><i data-ic="more"></i></button>
        <div class="list">
          <button id="mPhone" class="admin"><i data-ic="phone"></i>手机端（扫码）…</button>
          <button id="mAdd" class="admin"><i data-ic="plus"></i>添加项目…</button>
          <button id="mSM" class="admin"><i data-ic="listx"></i>会话管理（搜索 / 归档 / 删除 / 还原）…</button>
          <button id="mCSync" class="admin needcdesk" title="这台电脑上没装 Claude 桌面端时不显示"><i data-ic="sync"></i>同步 Claude 会话到当前账号…</button>
          <button id="mXSync" class="admin"><i data-ic="download"></i>把 Codex 对话同步进 Claude…</button>
          <button id="mLink"><i data-ic="link"></i>连线（指定谁给谁派活）…</button>
          <button id="mFiles"><i data-ic="folder"></i>文件（查看 / 差异 / 历史）…</button>
          <button id="mPRs"><i data-ic="gitpr"></i>GitHub PR 列表…</button>
          <button id="mChg"><i data-ic="gitdiff"></i>本地改动 / 代码审查…</button>
          <button id="mInst" class="admin"><i data-ic="wrench"></i>安装 / 升级 / 修复</button>
          <button id="mTest" class="admin"><i data-ic="activity"></i>自检</button>
          <button id="mRm" class="admin"><i data-ic="listx"></i>从列表移除</button>
          <button id="mUninst" class="danger admin"><i data-ic="trash"></i>卸载…</button>
          <hr class="admin" style="border:0;border-top:1px solid var(--line);margin:4px 0">
          <button id="mFxTest" class="admin needfx"><i data-ic="play"></i>试放桌面信件动画</button>
          <button id="mBrowser"><i data-ic="external"></i>在浏览器中打开</button>
          <button id="mSet"><i data-ic="gear"></i>设置…</button>
        </div>
      </div>
    </div>
    <button class="sbtg" id="tgR" aria-pressed="true"><i data-ic="panelR"></i><span class="sdot"></span></button>
  </header>

  <div class="body">
    <div class="sbrz" id="rzL" title="拖动改宽度，双击恢复"></div><div class="sbrz" id="rzR" title="拖动改宽度，双击恢复"></div>
    <aside class="side sideL" id="colL"><div class="sfoot slegend" id="footL"></div></aside>
    <section class="center">
      <div>
        <div class="banner" id="banner" style="display:none"></div>
        <div class="banner" id="pauseBanner" style="display:none"></div>
        <div class="trhead" id="trHead" style="display:none"></div>
        <div class="filters" id="filters">
          <span class="chip on" data-f="all">全部<span class="n" id="nAll"></span></span>
          <span class="chip" data-f="msg">消息<span class="n" id="nMsg"></span></span>
          <span class="chip" data-f="task">任务<span class="n" id="nTask"></span></span>
          <button class="ghost mob" id="qBtn" title="搜索"><i data-ic="search"></i></button>
          <input id="q" placeholder="搜索消息内容 / 编号 / 会话名">
        </div>
      </div>
      <div class="stream" id="stream"><div class="empty">正在加载…</div></div>
      <div class="stream trv" id="trView" style="display:none"></div>
      <button class="newpill" id="newPill">有新消息 <i data-ic="down"></i></button>
      <div class="compose" id="compose">
        <div class="crow">
          <span id="toWrap"><span>发给</span> <select id="to"></select></span>
          <span id="toFixed" style="display:none"></span>
          <label id="wakeWrap" title="给 Codex 会话发时，用 codex queue 排一条提醒叫醒它"><input type="checkbox" id="wake" checked> 叫醒 Codex</label>
          <span class="hint" id="hint">Ctrl+Enter 发送</span>
        </div>
        <div class="cin">
          <textarea id="text" rows="1" placeholder="以「用户」身份发消息…"></textarea>
          <button class="primary" id="sendBtn">发送</button>
        </div>
      </div>
    </section>

    <aside class="side" id="colR">
      <div class="card sesscard" id="cardClaude">
        <h3><span class="a-claude"><i data-ic="claude" data-cls="logo"></i>Claude</span> 会话 <span id="nClaude"></span><button class="rf" data-refresh title="刷新会话列表"><i data-ic="refresh"></i></button><button class="rf admin" data-addproj title="添加项目…"><i data-ic="plus"></i></button><span class="sp winpos" id="posClaude"></span></h3>
        <div id="sessClaude"><div class="grp">加载中…</div></div>
      </div>
      <div class="card sesscard" id="cardCodex">
        <h3><span class="a-codex"><i data-ic="codex" data-cls="logo"></i>Codex</span> 会话 <span id="nCodex"></span><button class="rf" data-refresh title="刷新会话列表"><i data-ic="refresh"></i></button><button class="rf admin" data-addproj title="添加项目…"><i data-ic="plus"></i></button><span class="sp winpos" id="posCodex"></span></h3>
        <div id="codexSt" class="grp" style="margin:0 0 4px"></div>
        <div id="sessCodex"><div class="grp">加载中…</div></div>
      </div>
      <div class="sfoot slegend" id="footR"></div>
    </aside>
  </div>
  <nav class="mnav" id="mnav">
    <button data-m="bus" class="on"><i data-ic="chat"></i><span>消息</span><i id="bNav"></i></button>
    <button data-m="sess"><i data-ic="users"></i><span>会话</span><i id="sNav"></i></button>
  </nav>
</div>

<div class="toast" id="toast"></div>
<div id="updBar" class="admin"></div>
<div class="dlg" id="dlg"><div class="box">
  <div class="hd"><span id="dlgTitle"></span><button class="ghost" onclick="closeDlg()"><i data-ic="x"></i></button></div>
  <div class="bd" id="dlgBody"></div>
  <div class="ft" id="dlgFt"><button onclick="closeDlg()">关闭</button></div>
</div></div>

function stateOf(p){
  if (p.exists === false) return ["bad","目录不存在"];
  if (!p.bus_dir) return ["", "未安装"];
  if (!p.installed) return ["warn","钩子不全"];
  if (p.hook_py_missing) return ["warn","总线可修复"];
  if ((p.codex_trusted||[]).length < (p.codex_total||3)) return ["warn","待信任 Codex 钩子"];
  if (p.bus_outdated) return ["warn","可升级"];

}

function wirePick(goId, label, extra = 0, scope = "#dlg", nid = "pickN"){   // extra：不用勾、总会一起做的条数（如要刷新的）

    if ($("#" + nid)) $("#" + nid).textContent = `已选 ${n} / ${total}`;

  $$(scope + " [data-pick]").forEach(b => b.onclick = () => {
    boxes().forEach(x => x.checked = b.dataset.pick === "all" ? true : !x.checked); sync(); });

function csRender(ps){

        <div style="margin-top:8px">重启 Claude 桌面端就能在列表里看到。</div>`); }

function resultOf(id){ for (let i = msgs.length - 1; i >= 0; i--) { const m = msgs[i]; if ((m.kind === "result" || m.kind === "recall") && m.reply_to === id) return m; } return null; }
let recallNo = {};      // 撤不回的任务：id → 原因

  const k = m.kind || "msg";
  if (k === "recall") return false;           // 撤回记录不单独显示，画在那张任务卡上
  if (filter === "msg" && k !== "msg") return false;

  if (query) { const q = query.toLowerCase();
    if (![m.text, m.id, m.reply_to, m.from.name, m.to].some(x => String(x||"").toLowerCase().includes(q))) return false; }

function msgHtml(m){
  const a = m.from.agent, k = m.kind || "msg", fail = k==="result" && String(m.text).startsWith("【没做成】");
  const r0 = k==="task" ? resultOf(m.id) : null, rec = r0 && r0.kind === "recall", r = rec ? null : r0, rfail = r && String(r.text).startsWith("【没做成】");
  let badge = "";
  const tk = (m.to_keys || [])[0] || "", ta = tk.split("-")[0], ts = tk.slice(ta.length + 1);
  const viaLink = k==="task" && (a === "claude" || a === "codex") && (ta === "claude" || ta === "codex") && ta !== a &&
    LKS.some(l => l[a] === m.from.sid && l[ta] === ts);

    + (recallNo[m.id] ? ` <span class="badge" title="${esc(recallNo[m.id])}">已送达</span>` : "");
  if (k==="result") badge = `<span class="badge ${fail?"b-bad":"b-ok"}">${fail?"没做成":"结果"}</span> <a class="link" data-jump="${esc(m.reply_to)}">回应任务 #${esc(String(m.reply_to).slice(0,6))}</a>`;

  let linked = "";

  const cls = ["msg", a==="user"?"mine":"", k==="task"?"task":"", k==="result"?"result":"", fail?"fail":"", rec?"recalled":""].join(" ");
  return `<div class="${cls}" id="m-${esc(m.id)}">
    <div class="meta">${badge}<span class="who a-${esc(a)}">${logo(a)}${esc(nameOf(m.from.name))}</span>
      <span class="mono">→ ${esc(m.to)}</span><span title="${esc(new Date(m.ts*1000).toLocaleString())}">${hm(m.ts)}</span><span class="mono">#${esc(m.id.slice(0,6))}</span></div>
    <div class="txt ${long?"clamp":""}">${prLinkify(esc(m.text))}</div>

    <div class="acts">${a!=="user"?`<button data-reply="${esc(keyOf(a, shortOf(m.from)))}" title="回复这个会话">回复</button>`:""}
      <button data-copy="${esc(k==="task"?m.id:(m.reply_to||m.id))}" title="复制编号">复制编号</button>${k==="task" && !r0 && !recallNo[m.id] ? `<button data-recall="${esc(m.id)}" title="对方还没收到时可以撤回（收到了就撤不回）">撤回</button>` : ""}</div></div>`;
}

// ---------- 会话头像（bloub：MIT，Jérémy Perret）----------
// 身形、颜色按会话号定（同一个会话永远长一样）；活跃的会动（呼吸 / 眨眼 / 眼神漂移），
// 待命的静止「专注」脸，空闲的静止「犯困」脸。数据由 tools/gen_bloub_icons.ts 用 bloub 的引擎导出。
let BB = null, bbSeq = 0;
const BB_COLORS = ["rouge","orange","ambre","vert","turquoise","bleu","violet","rose","brun","gris"];  // 不用纯黑 / 米白：深浅主题下会看不见
fetch("/bloub-icons.json").then(r => r.json()).then(d => {
  BB = d;
  const st = document.createElement("style");
  st.textContent = Object.entries(d.anim).map(([sh, a]) => {
    const pct = i => (i * 100 / a.scale.length).toFixed(2) + "%";
    const kf = (name, val) => `@keyframes ${name}{${a.scale.map((_, i) => `${pct(i)}{transform:${val(i)}}`).join("")}100%{transform:${val(0)}}}`;
    return kf(`bb-${sh}-b`, i => `scale(${a.scale[i]})`) + [0, 1].map(k => kf(`bb-${sh}-${k}`, i => `matrix(${a.eyes[i][k]})`)).join("");
  }).join("");
  document.head.appendChild(st);
  if (typeof pollSessions === "function") pollSessions();
}).catch(() => {});
function bbHash(s){ let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function bbAvatar(x, st, size){
  // Codex 会话也用按会话号生成的小角色头像（和 Claude 那边一样；以前是统一的 OpenAI 标志方块，0.4.2 起不用了，标志只留在栏标题上）
  if (!BB) return `<i class="dot d-${st}"></i>`;
  const h = bbHash(x.agent + ":" + x.sid), shapes = Object.keys(BB.shapes);
  const sh = shapes[h % shapes.length], color = BB.colors[BB_COLORS[(h >>> 4) % BB_COLORS.length]];
  // 收紧画布：原数据留了给特效的大边（±158），身体最宽约 ±115，按 118 取，头像在小格子里才显得够大
  const vb = 118, id = "bbm" + (++bbSeq), live = st === "active";
  let eyes;
  if (live) {
    // 按当前时间定播放位置：列表几秒重画一次，这样动画能接着播、不会跳回开头；再按会话号错开，别一起眨眼
    const a = BB.anim[sh], delay = -((Date.now() / 1000 + ((h >>> 8) % 1000) / 1000 * a.secs) % a.secs);
    eyes = a.d.map((d, k) => `<path class="bb-a" d="${d}" fill="#000" style="animation-name:bb-${sh}-${k};animation-duration:${a.secs}s;animation-delay:${delay}s"/>`).join("");
  } else {
    const ex = st === "stand" ? "attentif" : "somnolent";
    eyes = BB.eyes[sh][ex].map(([d, m]) => `<path d="${d}" transform="matrix(${m})" fill="#000"/>`).join("");
  }
  const body = "";            // 0.4.2：身体不再单独缩放，整个头像一起呼吸（见 .bbw.live）
  const px = size || 26;
  return `<span class="bbw${live ? " live" : ""}" style="width:${px}px;height:${px}px" title="${st === "active" ? "活跃" : st === "stand" ? "待命" : "空闲"}"><svg width="${px}" height="${px}" viewBox="${-vb} ${-vb} ${vb * 2} ${vb * 2}" aria-hidden="true">
    <defs><mask id="${id}" maskUnits="userSpaceOnUse" x="${-vb}" y="${-vb}" width="${vb * 2}" height="${vb * 2}"><g ${body}><path d="${BB.shapes[sh]}" fill="#fff"/>${eyes}</g></mask></defs>
    <rect x="${-vb}" y="${-vb}" width="${vb * 2}" height="${vb * 2}" fill="${color}" mask="url(#${id})"/></svg><i class="dot d-${st}"></i></span>`;

// ---------- GitHub PR 预览 / 查看 / 代码审查（全部只读：gh / git 只查不改；审查请求经总线发给会话） ----------
// 对话和总线消息里的 PR / issue 引用（完整链接、owner/repo#123）画成小标签 + 预览卡片；点开右侧 PR 面板看说明、检查、提交、改动和评论
const PR_RE = /(^|[\s(（:：,，、\[【"'])(?:(https:\/\/github\.com\/([\w.-]+)\/([\w.-]+)\/(?:pull|issues)\/(\d+))(?:[\/#?][^\s<)）\]】"']*)?|([A-Za-z0-9][\w-]{0,38})\/([\w.-]{1,100})#(\d{1,7}))(?=$|[\s)）.,，。:：;；!！?？、\]】"'])/g;

const prKey = (o, r, n) => `${o}/${r}#${n}`;
function prRefs(text){
  const out = []; let m; PR_RE.lastIndex = 0;
  const s = String(text || "").replace(/```[\s\S]*?```/g, " ").replace(/`[^`\n]*`/g, " ");
  while ((m = PR_RE.exec(s))) { const k = m[2] ? prKey(m[3], m[4], m[5]) : prKey(m[6], m[7], m[8]);
    if (/^\d+$/.test(m[6] || "x") || /\.(py|js|ts|md|json|txt|html|rs|go)$/i.test(m[7] || "")) continue;
    if (!out.includes(k)) out.push(k); }
  return out;
}
// 已转义的文本里把引用换成小标签（跳过 <a …>…</a> 和 <code>）
function prLinkify(s){
  const keep = [];
  s = s.replace(/<a\b[\s\S]*?<\/a>|<code>[\s\S]*?<\/code>|\u0000\d+\u0000/g, x => { keep.push(x); return "\u0001" + (keep.length - 1) + "\u0001"; });
  s = s.replace(PR_RE, (all, pre, url, o1, r1, n1, o2, r2, n2) => {
    if (o2 && (/^\d+$/.test(o2) || /\.(py|js|ts|md|json|txt|html|rs|go)$/i.test(r2))) return all;
    const k = url ? prKey(o1, r1, n1) : prKey(o2, r2, n2);
    return pre + prChip(k, url ? all.slice(pre.length) : k);
  });
  return s.replace(/\u0001(\d+)\u0001/g, (m, i) => keep[+i]);
}
function prChip(k, label){
  const v = (PRC[k] || {}).v, st = v && v.ok ? (v.kind === "issue" ? "is-" : "") + v.state : "";
  const short = label && label.startsWith("https://") ? k : (label || k);

// ---------- 统一 diff 查看器：按文件折叠，行号 + 简单语法高亮 ----------
const HL_KW = new Set("abstract and as async await break case catch class const continue def default del delete do elif else enum export extends false final finally fn for from func function go if impl import in interface is lambda let match mod mut new nil none not null or package pass private protected pub public raise return self static struct super switch this throw true try type typeof use var void while with yield None True False".split(" "));
const HL_RE = /(\/\/[^\n]*|#[^\n]*|\/\*[\s\S]*?\*\/|<!--[\s\S]*?-->)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|`(?:[^`\\]|\\.)*`)|(\b\d[\d_.xXa-fA-F]*\b)|([A-Za-z_$][\w$]*)/g;
function hlLine(s, lang){

  while ((m = HL_RE.exec(s))) {

      out += esc(s.slice(last, m.index + 1)); last = m.index + 1; HL_RE.lastIndex = m.index + 1; continue; }
    out += esc(s.slice(last, m.index));
    const t = esc(m[0]);
    out += m[1] ? `<i class="hc">${t}</i>` : m[2] ? `<i class="hs">${t}</i>` : m[3] ? `<i class="hn">${t}</i>` : HL_KW.has(m[4]) ? `<i class="hk">${t}</i>` : t;
    last = m.index + m[0].length;

  return out + esc(s.slice(last));
}

    if (!f) continue;
    if (!f.lines.length && !l.startsWith("@@")) { if (/^(new file|deleted file|rename|similarity|Binary)/.test(l)) f.meta.push(l); continue; }

  const ta = diffFiles.reduce((a, f) => a + f.add, 0), td = diffFiles.reduce((a, f) => a + f.del, 0);
  const many = diffFiles.length > 25;
  return `<div class="dfsum">${diffFiles.length} 个文件 · <span class="pradd">+${ta}</span> <span class="prdel">-${td}</span>${truncated ? " · 太大，只显示了前一部分" : ""}<span class="dfall"><span class="fvseg"><button data-psplit="0" class="${prSplit ? "" : "on"}">统一</button><button data-psplit="1" class="${prSplit ? "on" : ""}">并排</button></span> <a class="link" data-dfx="1">全部展开</a> · <a class="link" data-dfx="0">全部收起</a></span></div>` +
    diffFiles.map((f, i) => { const open = (!many || i < 3) && f.lines.length < 1500;
      const tag = f.meta.some(x => x.startsWith("new file")) ? '<span class="dftag add">新增</span>' : f.meta.some(x => x.startsWith("deleted")) ? '<span class="dftag del">删除</span>' : f.meta.some(x => x.startsWith("rename")) ? '<span class="dftag">改名</span>' : "";
      return `<details class="dff" data-i="${i}" ${open ? "open" : ""}><summary><span class="tgc">${ic("chev")}</span><span class="dfp" title="${esc(f.path)}">${esc(f.path)}</span>${tag}<span class="pradd">+${f.add}</span><span class="prdel">-${f.del}</span></summary><div class="dfb">${open ? diffFileHtml(f) : ""}</div></details>`; }).join("");
}
let prSplit = store.get("msgbus.prSplit") === "1";
function diffFileHtml(f){
  if (f.lines.length) { const out = diffRowsHtml(patchRows(f.lines.slice(0, 5000)), langOf(f.path), prSplit); return out.html + (f.lines.length > 5000 ? `<div class="dfmeta">（这个文件改得太多，只显示前 5000 行）</div>` : ""); }

function diffFileHtmlOld(f){

  const lang = /^(py|js|mjs|cjs|ts|tsx|jsx|java|kt|go|rs|c|h|cc|cpp|hpp|cs|rb|php|swift|sh|ps1|lua|gd|toml|yaml|yml|json|html|css|scss|vue|svelte|sql|r|pl|cfg|ini|dockerfile|cmake|mk|iss)$/.test(ext) ? ext : "";

    if (l.startsWith("\\")) { out += `<div class="dl hh"><span class="ln"></span><span class="ln"></span><span class="dc">${esc(l)}</span></div>`; continue; }

}
function diffBind(B){

// ---------- 本地改动（git status + diff，对比 HEAD 或某个主干的分叉点） ----------
let chgD = {}, chgBase = "HEAD";

// ---------- 代码审查：选一个会话，经总线（以你本人的名义）发「请只读审查这个 PR / 这些改动」 ----------
function reviewDlg(o){
  if (!cur) return toast("先选一个项目");
  const ok = sessList.filter(x => ["claude", "codex", "cursor"].includes(x.agent) && !x.archived);
  if (!ok.length) return toast("这个项目还没有会话可以发");
  const pick = view && ok.find(x => x.agent === view.agent && x.sid === view.sid) ? view : ok[0];
  const what = o.ref ? `PR <b>${esc(o.ref)}</b>${o.title ? "：" + esc(o.title) : ""}` : `本地改动（对比 <b>${esc(o.base === "HEAD" ? "HEAD，没提交的" : o.base)}</b>，${o.n || 0} 个文件）`;
  openDlg("代码审查", `<div class="revd"><div>请一个会话只读审查 ${what}。它会以「你本人」的名义收到请求，并被要求<b>不改代码、不推送、不在 GitHub 上评论 / 批准 / 合并</b>，把问题列出来回复你。</div>
    <label class="lbl2">发给</label><select id="revTo">${ok.map(x => `<option value="${esc(x.agent + "|" + x.sid)}" ${x.sid === pick.sid ? "selected" : ""}>${esc(x.agent === "codex" ? "Codex" : x.agent === "cursor" ? "Cursor" : "Claude")} · ${esc(x.alias || x.title || x.short)} · ${esc(sessState(x)[1] || "")}</option>`).join("")}</select>
    <label class="lbl2">补充说明（可选）</label><textarea id="revNote" rows="3" placeholder="比如：重点看并发 / 错误处理"></textarea></div>`,
    `<button onclick="closeDlg()">取消</button><button class="primary" id="revGo">${ic("eye")} 发送审查请求</button>`);
  $("#revGo").onclick = async () => {
    const [agent, sid] = $("#revTo").value.split("|"), b = $("#revGo"); b.disabled = true; b.textContent = "发送中…";
    try {
      const r = await api("/api/review", Object.assign({root: cur.root, agent, sid, note: $("#revNote").value}, o.ref ? {ref: o.ref} : {base: o.base}));
      closeDlg();
      if (r.ok === false) { openDlg("❌ 没发出去", `<pre>${esc(r.output || r.error || "")}</pre>`); return; }
      toast("✅ 已发出审查请求" + (r.via === "codex-queue" ? "（交给 Codex）" : "（经总线）"), 3200);
      const x = ok.find(s => s.agent === agent && s.sid === sid); prClose(); if (x) openSession(x);
      // 跟输入框发送一样：Claude / Cursor 要等它收到才进记录，先放一个「已发出」的气泡
      const mid = (String(r.output || "").match(/已发送(?:消息|任务)\s+([0-9a-f]{12})/) || [])[1];
      if (x && agent !== "codex" && mid && r.text) { trPending.push({vk: tabKey(x), text: r.text, kind: "msg", mid, ts: Date.now() / 1000}); trRender(true); }
    } catch(e) { b.disabled = false; b.innerHTML = `${ic("eye")} 发送审查请求`; toast("❌ " + (e.message || e), 4000); }
  };
}

const LANG_EXT = {py: "py", pyw: "py", js: "js", mjs: "js", cjs: "js", ts: "ts", tsx: "ts", jsx: "js", json: "json", md: "md", markdown: "md",

  zsh: "sh", ps1: "ps1", psm1: "ps1", yaml: "yaml", yml: "yaml", toml: "toml", ini: "ini", cfg: "ini", html: "html", htm: "html", xml: "html",
  vue: "html", svelte: "html", css: "css", scss: "css", less: "css", sql: "sql", rb: "rb", php: "c", swift: "c", gd: "py", iss: "ini",
  cmd: "bat", bat: "bat", txt: "", gitignore: "sh", dockerfile: "sh", mk: "sh", cmake: "sh", r: "py", pl: "sh"};

const HL2 = /(--[^\n]*|\/\/[^\n]*|#[^\n]*|\/\*[\s\S]*?\*\/|<!--[\s\S]*?-->)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|`(?:[^`\\]|\\.)*`)|(\b\d[\d_.xXa-fA-F]*\b)|([A-Za-z_$][\w$]*)/g;
function hl2(s, lang){

  let out = "", last = 0, m; HL2.lastIndex = 0;
  while ((m = HL2.exec(s))) {

      if (!ok) { out += esc(s.slice(last, m.index + 1)); last = m.index + 1; HL2.lastIndex = m.index + 1; continue; } }
    out += esc(s.slice(last, m.index));
    const t = esc(m[0]);

// 整个文件逐行高亮：跨行的块注释 / 三引号字符串整行标成注释色
function hlLines(lines, lang){
  const open = lang === "lua" ? [/--\[=*\[/, /\]=*\]/] : lang === "py" ? [/("""|''')/, null] : /^(js|ts|c|go|rs|css|json)$/.test(lang) ? [/\/\*/, /\*\//] : lang === "html" ? [/<!--/, /-->/] : null;
  let inside = null;
  return lines.map(l => {
    if (inside) { const e = l.search(inside); if (e < 0) return `<i class="hc">${esc(l)}</i>`;
      const end = e + (l.slice(e).match(inside) || [""])[0].length; inside = null; return `<i class="hc">${esc(l.slice(0, end))}</i>` + hl2(l.slice(end), lang); }
    if (open) { const m = l.match(open[0]);
      if (m) { const after = l.slice(m.index + m[0].length), closeRe = open[1] || new RegExp(m[0].replace(/[\\"']/g, c => "\\" + c));
        const before = l.slice(0, m.index);
        if (lang === "py" && (before.match(/["']/g) || []).length % 2) return hl2(l, lang);
        if (!closeRe.test(after)) { inside = closeRe; return hl2(before, lang) + `<i class="hc">${esc(l.slice(m.index))}</i>`; } } }
    return hl2(l, lang);

$("#mPRs").onclick = () => { prStack = []; prCur = null; prListOpen(); };
$("#mChg").onclick = () => { prStack = []; prCur = null; chgOpen(); };
// ---------- 轮询 ----------

// ---------- 右侧滑出面板（子任务 / PR·改动 / 文件）和文件树：拖内侧边改宽度，双击恢复；每个面板各记各的 ----------
const PANEL_RZ = [["subPanel", 320], ["prPanel", 420], ["fvPanel", 560]];
function pnApply(){
  PANEL_RZ.forEach(([id]) => { const p = document.getElementById(id), w = +store.get("msgbus.pw." + id) || 0; if (p) p.style.width = w ? Math.min(w, innerWidth - 120) + "px" : ""; });
  const fs = $("#fvPanel .fvside"), fw = +store.get("msgbus.pw.fvside") || 0; if (fs) fs.style.width = fw ? fw + "px" : "";
}
PANEL_RZ.forEach(([id, min]) => {
  const p = document.getElementById(id); if (!p) return;
  const h = document.createElement("div"); h.className = "pnrz"; h.title = "拖动改宽度，双击恢复"; p.appendChild(h);
  rzBind(h, {dir: -1, get: () => p.getBoundingClientRect().width, min: () => Math.min(min, innerWidth - 120), max: () => Math.max(min, innerWidth - 120),
    set: w => { p.style.width = w + "px"; }, save: w => store.set("msgbus.pw." + id, String(w)),
    reset: () => { store.set("msgbus.pw." + id, ""); p.style.width = ""; }});
});
(() => { const fs = $("#fvPanel .fvside"); if (!fs) return;
  const h = document.createElement("div"); h.className = "pnrz pnrz-r"; h.title = "拖动改文件树宽度，双击恢复"; fs.appendChild(h);
  rzBind(h, {dir: 1, get: () => fs.getBoundingClientRect().width, min: () => 160, max: () => Math.max(160, $("#fvPanel").getBoundingClientRect().width - 320),
    set: w => { fs.style.width = w + "px"; }, save: w => store.set("msgbus.pw.fvside", String(w)), reset: () => { store.set("msgbus.pw.fvside", ""); fs.style.width = ""; }});
})();
pnApply(); window.addEventListener("resize", pnApply);
// 托盘菜单 / 通知点进来：切到那个项目、打开那个会话（没有会话就回总线消息）；settings = 打开设置（检查更新）
window.ccOpen = async (o) => {
  o = o || {};
  if (o.settings) { openSettings(); return true; }
  if (o.root && (!cur || cur.root !== o.root) && projects.some(p => p.root === o.root)) await select(o.root);
  if (o.agent && o.sid) {
    const x = sessList.find(s => s.agent === o.agent && s.sid === o.sid) || {agent: o.agent, sid: o.sid, short: shortOfSid(o.agent, o.sid)};
    openSession(x);
  } else showBus();
  return true;
};
function stopPolling(){ timers.forEach(clearInterval); timers = []; }
function startPolling(){
  stopPolling(); pollMessages(); pollSessions(); pollCodex(); pollOtherSessions();
  timers.push(setInterval(pollMessages, 1500), setInterval(pollSessions, 6000), setInterval(pollCodex, 15000), setInterval(loadProjects, 20000), setInterval(pollOtherSessions, 20000), setInterval(pollTranscript, 2000));
}
(async () => {
  await loadMe();
  loadUpdate(); setTimeout(loadUpdate, 20000); setInterval(loadUpdate, 30 * 60 * 1000);   // 启动后服务会在后台查一次
  await loadProjects();
  const last = store.get("msgbus.cur");
  const pick = projects.find(p => p.root === last) || projects[0];
  if (pick) select(pick.root);
  else { $("#stream").innerHTML = `<div class="empty">还没有项目。点右上角 ⋯ →「添加项目」。</div>`; $("#compose").style.display="none"; }
})();
</script>
